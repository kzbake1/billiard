const BYE={t:'bye'};
const P=id=>({t:'p',id});
const TBD=label=>({t:'tbd',label});
const TPR={no:'неявка',refuse:'отказ от игры',dq:'дисквалификация',other:'другое'};

const scTxt=(r,side)=>r&&r.tp?(tpOf(r,side)?'<em class="tp">ТП</em>':''):(r?r['s'+side]:'');
function nextPow2(n){let p=1;while(p<n)p*=2;return p}
function seedOrder(N){let a=[1];while(a.length<N){const L=a.length*2,b=[];for(const x of a)b.push(x,L+1-x);a=b}return a}
function placeSeeds(slots){const N=nextPow2(Math.max(2,slots.length));return seedOrder(N).map(s=>slots[s-1]||BYE)}

function mk(ctx,id,a,b,meta){
  const no=++ctx.no;const m={id,no,a,b,meta:meta||{}};
  const r=ctx.T.results[id];
  if(a.t==='bye'&&b.t==='bye'){m.state='bye';m.winner=BYE;m.loser=BYE}
  else if(a.t==='bye'&&b.t==='p'){m.state='bye';m.winner=b;m.loser=BYE}
  else if(b.t==='bye'&&a.t==='p'){m.state='bye';m.winner=a;m.loser=BYE}
  else if(a.t==='p'&&b.t==='p'){
    const ok=r&&r.a===a.id&&r.b===b.id;
    if(ok&&r.done){m.state='done';m.res=r;if(r.tp==='both'){m.winner=BYE;m.loser=BYE}else{const aw=r.tp?r.tp==='b':r.sa>r.sb;m.winner=aw?a:b;m.loser=aw?b:a}}
    else{m.state=ok&&(r.live||r.call)?'live':'ready';if(ok&&(r.live||r.call))m.res=r;m.winner=TBD('Поб. №'+no);m.loser=TBD('Пр. №'+no)}
  } else {
    m.state='wait';m.winner=TBD('Поб. №'+no);
    m.loser=(a.t==='bye'||b.t==='bye')?BYE:TBD('Пр. №'+no);
  }
  ctx.all.push(m);return m;
}
function seTitle(k){if(k===0)return'Финал';if(k===1)return'1/2 финала';return'1/'+(2**k)+' финала'}
function buildSE(ctx,slots,prefix){
  const rounds=[];let cur=slots,r=0;const R=Math.log2(slots.length);
  while(cur.length>1){r++;const ms=[],next=[];
    for(let i=0;i<cur.length;i+=2){const m=mk(ctx,prefix+r+'-'+i/2,cur[i],cur[i+1]);ms.push(m);next.push(m.winner)}
    rounds.push({title:seTitle(R-r),matches:ms});cur=next}
  let third=null;if(ctx.T.third&&rounds.length>=2){const sf=rounds[rounds.length-2].matches;if(sf.length===2)third=mk(ctx,prefix+'3p',sf[0].loser,sf[1].loser)}
  return{rounds,champ:cur[0],third};
}
function playoffK(T,n){const N=nextPow2(Math.max(2,n));let K=T.playoff==null?0:T.playoff;if(K==='auto')K=N>=32?8:4;K=+K||0;while(K>N/2)K/=2;return K>=4?K:0}
function buildDE(ctx,ids){
  const slots=placeSeeds(ids.map(P));const N=slots.length,R=Math.log2(N);const K=playoffK(ctx.T,ids.length);
  const Wr=K?R-Math.log2(K)+1:R;
  const compact=N>=16&&ids.length<=N*3/4,sd=seedOrder(N),kept=[];
  const wb=[],losers=[];let cur=slots;
  for(let r=1;r<=Wr;r++){const ms=[],nx=[],ls=[];
    for(let i=0;i<cur.length;i+=2){
      if(compact&&r===1&&Math.min(sd[i],sd[i+1])<=N/4){nx.push(cur[i].t==='bye'?cur[i+1]:cur[i]);ls.push(BYE);continue}
      const m=mk(ctx,'w'+r+'-'+i/2,cur[i],cur[i+1]);ms.push(m);nx.push(m.winner);ls.push(m.loser);if(r===1)kept.push(m.loser)}
    wb.push({title:!K&&r===R?'Финал верхней':'Раунд '+r,matches:ms});losers.push(ls);cur=nx}
  const lb=[];let lc=[];
  if(R>=2){let lr=0;
    const run=(a,pairs)=>{lr++;const ms=[],nx=[];for(let i=0;i<pairs.length;i++){const m=mk(ctx,'l'+lr+'-'+i,pairs[i][0],pairs[i][1]);ms.push(m);nx.push(m.winner)}lb.push({title:'Раунд '+(lb.length+1),matches:ms});return nx};
    const pairUp=arr=>{const p=[];for(let i=0;i<arr.length;i+=2)p.push([arr[i],arr[i+1]]);return p};
    if(compact){lr=1;lc=kept}else lc=run(0,pairUp(losers[0]));
    for(let k=2;k<=Wr;k++){const drop=losers[k-1].slice();if(k%2===0)drop.reverse();
      lc=run(0,lc.map((s,i)=>[s,drop[i]]));
      if(k<Wr)lc=run(0,pairUp(lc));}
    if(!K)lb[lb.length-1].title='Финал нижней';
  } else lc=[losers[0][0]];
  if(K&&ctx.T.stopAt&&!(+ctx.T.stopAt<K))return{wb,lb,rounds:[],champ:BYE,third:null,K,stop:true,name:(compact?N*3/4:N)+'-'+K,up:cur,low:lc};
  if(K){const h=K/2,sh=h/2;const ps=[];const T=ctx.T;
    const perm=T.draw&&Array.isArray(T.poPerm)&&T.poPerm.length===h?T.poPerm:null;
    for(let i=0;i<h;i++){ps.push(cur[i],T.draw?(perm?lc[perm[i]]:TBD('По жребию')):lc[h===2&&Wr%2===0?i:i^1])}
    const se=buildSE(ctx,ps,'p');if(T.stopAt&&+T.stopAt<K){const cut=Math.round(Math.log2(K/+T.stopAt));const rs=se.rounds.slice(0,cut);const drop=new Set(se.rounds.slice(cut).flatMap(r=>r.matches));if(se.third)drop.add(se.third);for(let i=ctx.all.length-1;i>=0;i--)if(drop.has(ctx.all[i]))ctx.all.splice(i,1);return{wb,lb,rounds:rs,champ:BYE,third:null,K,stop:true,q:rs[rs.length-1].matches.map(m=>m.winner),stopN:+T.stopAt,name:(compact?N*3/4:N)+'-'+K,draw:!!T.draw,drawn:!!perm,up:cur,low:lc}}return{wb,lb,rounds:se.rounds,champ:se.champ,third:se.third,K,name:(compact?N*3/4:N)+'-'+K,draw:!!T.draw,drawn:!!perm,up:cur,low:lc}}
  const wbChamp=cur[0],lbChamp=lc[0];
  const gf=mk(ctx,'gf',wbChamp,lbChamp);let final=gf,gf2=null;
  if(gf.state==='done'&&lbChamp.t==='p'&&gf.winner.id===lbChamp.id){gf2=mk(ctx,'gf2',wbChamp,lbChamp);final=gf2}
  return{wb,lb,gf,gf2,final};
}
function maybeDraw(T){
  if(T.format!=='de'||!T.draw||T.poPerm||T.status==='reg')return false;
  const b=build(T);if(!b.K||![...b.up,...b.low].every(s=>s.t==='p'||s.t==='bye'))return false;
  const met=new Set();b.all.forEach(m=>{if(m.state==='done')met.add(m.a.id+'|'+m.b.id).add(m.b.id+'|'+m.a.id)});
  const h=b.K/2;let best=null,bs=1e9;
  for(let k=0;k<200&&bs>0;k++){const p=[...Array(h).keys()];for(let i=h-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]]}
    const sc=p.filter((x,i)=>met.has(b.up[i].id+'|'+b.low[x].id)).length;if(sc<bs){bs=sc;best=p}}
  T.poPerm=best;return true;
}
function deName(n,po){n=Math.max(2,n);const N=nextPow2(n),K=playoffK({playoff:po},n);return K?((N>=16&&n<=N*3/4?N*3/4:N)+'-'+K):''}
function buildRR(ctx,ids,prefix){
  let arr=ids.slice();if(arr.length%2)arr.push(null);const n=arr.length;const rounds=[],matches=[];
  for(let r=0;r<n-1;r++){const ms=[];
    for(let i=0;i<n/2;i++){const a=arr[i],b=arr[n-1-i];if(a&&b){const m=mk(ctx,prefix+a+'-'+b,P(a),P(b));ms.push(m);matches.push(m)}}
    rounds.push({title:'Тур '+(r+1),matches:ms});arr=[arr[0],arr[n-1],...arr.slice(1,n-1)]}
  const st={};ids.forEach(id=>st[id]={id,pl:0,w:0,l:0,ff:0,fa:0});
  for(const m of matches)if(m.state==='done'){const r=m.res,A=st[m.a.id],B=st[m.b.id];
    A.pl++;B.pl++;A.ff+=r.sa;A.fa+=r.sb;B.ff+=r.sb;B.fa+=r.sa;if(r.tp==='both'){A.l++;B.l++}else if(r.tp?r.tp==='b':r.sa>r.sb){A.w++;B.l++}else{B.w++;A.l++}}
  const h2h=(x,y)=>{const m=matches.find(m=>m.state==='done'&&((m.a.id===x&&m.b.id===y)||(m.a.id===y&&m.b.id===x)));return m&&m.winner.t==='p'?(m.winner.id===x?-1:1):0};
  const standings=Object.values(st).sort((x,y)=>y.w-x.w||((y.ff-y.fa)-(x.ff-x.fa))||y.ff-x.ff||h2h(x.id,y.id));
  return{rounds,matches,standings,complete:matches.every(m=>m.state==='done'),ids};
}
function buildGP(ctx,T,ids){
  const G=T.groups.count,K=T.groups.advance;
  const gIds=Array.from({length:G},()=>[]);
  ids.forEach((id,i)=>{const row=Math.floor(i/G);const g=row%2===0?i%G:G-1-i%G;gIds[g].push(id)});
  const groups=gIds.map((gi,k)=>Object.assign({name:'Группа '+LETTERS[k],letter:LETTERS[k]},buildRR(ctx,gi,'g'+k+'-')));
  const labels=[];for(let p=1;p<=K;p++){const ord=[...Array(G).keys()];if(p%2===0)ord.reverse();ord.forEach(g=>labels.push({g,p}))}
  const N=nextPow2(Math.max(2,labels.length));const placed=seedOrder(N).map(s=>labels[s-1]||null);
  for(let i=0;i<N;i+=2){const a=placed[i],b=placed[i+1];
    if(a&&b&&a.g===b.g){for(let j=0;j<N;j+=2){if(j===i)continue;const c=placed[j],d=placed[j+1];
      if(c&&d&&d.g!==a.g&&c.g!==b.g){placed[i+1]=d;placed[j+1]=b;break}}}}
  const slots=placed.map(l=>{if(!l)return BYE;const gr=groups[l.g];
    if(gr.complete){const row=gr.standings[l.p-1];return row?P(row.id):BYE}return TBD(gr.letter+l.p)});
  const se=buildSE(ctx,slots,'p');
  return{groups,rounds:se.rounds,champ:se.champ,third:se.third,K};
}
function build(T){
  if(T.stages)return stagesBuild(T);
  const ctx={T,no:0,all:[]};const out={all:ctx.all,match:!!T.match};
  if(T.status==='reg'){out.finished=false;return out}
  const ids=T.players.map(p=>p.id);
  if(T.format==='se'){const se=buildSE(ctx,placeSeeds(ids.map(P)),'s');out.rounds=se.rounds;out.champ=se.champ;out.third=se.third;out.finished=se.champ.t==='p'}
  else if(T.format==='de'){Object.assign(out,buildDE(ctx,ids));out.finished=out.stop?(out.q||[...out.up,...out.low]).every(s=>s.t==='p'):out.K?out.champ.t==='p':out.final.winner.t==='p'}
  else if(T.format==='rr'){const g=buildRR(ctx,ids,'r');out.groups=[Object.assign({name:'Таблица'},g)];out.finished=g.complete}
  else{Object.assign(out,buildGP(ctx,T,ids));out.finished=out.champ.t==='p'}
  if(!out.finished&&T.format!=='rr'&&ctx.all.length&&!ctx.all.some(m=>m.state==='ready'||m.state==='wait'||m.state==='live'))out.finished=true;
  if(out.finished&&out.third&&out.third.state!=='done'&&out.third.state!=='bye')out.finished=false;
  if(out.finished)out.places=computePlaces(T,out);
  return out;
}
function stKids(T){return((T.stages&&T.stages.ids)||[]).map(tById).filter(Boolean)}
function stFinal(T){return T.stages&&T.stages.final?tById(T.stages.final):null}
function stagesBuild(T){const F=stFinal(T);const out={all:[],stage:true,finished:false};
  if(F){const fb=build(F);out.finished=fb.finished;out.places=fb.places;out.champ=fb.champ}
  out.liveN=[...stKids(T),...(F?[F]:[])].reduce((a,t)=>a+build(t).all.filter(m=>m.state==='live').length,0);return out}
const FBX=8;const foOk=v=>{v=Math.floor(+v);return v>=1&&v<=15?v:0};
function tgt(T,m,k){const r=m&&m.res,f=r&&r.fo;if(f&&f.s)return f.s===k?FBX-(+f.n||0):FBX;if(f&&foOk(f[k]))return foOk(f[k]);const id=m&&m[k]&&m[k].id;const v=T&&T.foP&&id&&foOk(T.foP[id]);return v||FBX}
function foT(T,m){if(!m||m.a.t!=='p'||m.b.t!=='p')return null;const a=tgt(T,m,'a'),b=tgt(T,m,'b');return a===FBX&&b===FBX?null:{a,b,txt:a+':'+b}}
function foraOf(T,m){
  if(!(T.fora||T.foraG)||m.a.t!=='p'||m.b.t!=='p')return null;const pa=T.players.find(p=>p.id===m.a.id),pb=T.players.find(p=>p.id===m.b.id);if(!pa||!pb)return null;
  if(T.foraG){if(!pa.grp||!pb.grp||pa.grp===pb.grp)return null;const v=T.foraG[pa.grp+'|'+pb.grp]||T.foraG[pb.grp+'|'+pa.grp];if(!v||!v.n)return null;const r=v.to===pa.grp?pa:v.to===pb.grp?pb:null;return r?{n:v.n,id:r.id,p:r}:null}
  const ia=LVLS.indexOf(pa.lvl),ib=LVLS.indexOf(pb.lvl);if(ia<0||ib<0||ia===ib)return null;const n=T.fora[LVLS[Math.min(ia,ib)]+'|'+LVLS[Math.max(ia,ib)]];
  return n?{n,id:ia<ib?pa.id:pb.id,p:ia<ib?pa:pb}:null}
function computePlaces(T,b){
  const res=[];let place=1;
  const add=(ids,label)=>{ids=ids.filter(Boolean);if(!ids.length)return;res.push({from:place,to:place+ids.length-1,ids,label});place+=ids.length};
  const losersOf=rd=>rd.matches.map(m=>m.loser).filter(s=>s.t==='p').map(s=>s.id);
  const po=()=>{const rs=b.rounds;for(let i=rs.length-1;i>=0;i--){if(b.third&&i===rs.length-2)[b.third.winner,b.third.loser].filter(x=>x.t==='p').forEach(x=>add([x.id]));else add(losersOf(rs[i]))}};
  if(T.format==='rr'){b.groups[0].standings.forEach(r=>add([r.id]));return res}
  if(T.format==='de'){if(b.stop){add((b.q||[...b.up,...b.low]).filter(s=>s.t==='p').map(s=>s.id),'вышли в финал');if(b.q)[...b.rounds].reverse().forEach(rd=>add(losersOf(rd)))}else if(b.K){add([b.champ.id]);po()}else{add([b.final.winner.id]);add(losersOf({matches:[b.final]}))}[...b.lb].reverse().forEach(rd=>add(losersOf(rd)));return res}

    for(let p=b.K+1;p<=maxP;p++)add(b.groups.map(g=>g.standings[p-1]).filter(Boolean).map(r=>r.id),'не вышли из группы')}
  return res;
}

function cleanData(v,k){

  if(k==='quarter'){const q0=Math.floor((m-1)/3)*3+1;return[`${y}-${String(q0).padStart(2,'0')}-01`,last(y,q0+2)]}

function chartSVG(series){const sm=window.innerWidth<640;if(sm)series=series.slice(-6);const W=sm?480:960,H=sm?280:260,L=56,R=12,T=16,B=34;const n=series.length;const mx=Math.max(1,...series.map(s=>Math.max(s.got,s.mrr)));
  const step=Math.pow(10,Math.floor(Math.log10(mx)));const top=Math.ceil(mx/step/ (mx/step>5?2:1))*step*(mx/step>5?2:1);const iw=W-L-R,ih=H-T-B,bw=iw/n;
  const y=v=>T+ih-(v/top)*ih;const ticks=[0,.25,.5,.75,1].map(f=>Math.round(top*f));
  const sh=v=>v>=1e6?(v/1e6).toFixed(v%1e6?1:0)+' млн':v>=1e3?Math.round(v/1e3)+' тыс':String(v);
  const line=series.map((s,i)=>`${i?'L':'M'}${(L+bw*i+bw/2).toFixed(1)},${y(s.mrr).toFixed(1)}`).join(' ');
  return`<svg class="adm-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Получено и месячный доход за 12 месяцев">
  ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="g"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" class="t">${sh(v)}</text>`).join('')}
  ${series.map((s,i)=>{const x=L+bw*i+bw*.22,w=bw*.56,h=Math.max(0,T+ih-y(s.got));const [yy,mm]=s.m.split('-');return`<rect x="${x.toFixed(1)}" y="${y(s.got).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="4" class="b"><title>${MNOM[+mm-1]} ${yy}: получено ${money(s.got)}, месячный доход ${money(s.mrr)}</title></rect><text x="${(L+bw*i+bw/2).toFixed(1)}" y="${H-12}" text-anchor="middle" class="t">${MSHORT[+mm-1]}</text>`}).join('')}
  <path d="${line}" class="l"/>${series.map((s,i)=>`<circle cx="${(L+bw*i+bw/2).toFixed(1)}" cy="${y(s.mrr).toFixed(1)}" r="3.5" class="d"/>`).join('')}</svg>
  <div class="adm-leg"><span><i class="b"></i>Получено</span><span><i class="l"></i>Месячный доход</span></div>`}

  const tile=k=>{const x=map[k];if(!x)return`<div class="ptile"><b>${esc(tlabel(c,k))}</b><span class="pt-big muted">Свободен</span></div>`;
    const isCall=x.m.state==='call';const other=x.t!==T;

  const st=(m,side)=>`<span class="pl-n">${esc(pname(T,m[side]))}</span><button class="pbtn" aria-label="Убрать партию" data-act="sc" data-mid="${m.id}" data-side="${side}" data-d="-1">−</button><span class="pl-s">${m.res['s'+side]}</span><button class="pbtn plus" aria-label="Партия" data-act="sc" data-mid="${m.id}" data-side="${side}" data-d="1">+</button>`;
  return`<div class="pult-top"><a class="back" href="#t-${T.id}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-3px;margin-right:4px"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Страница турнира</a><div style="min-width:0"><h2 style="margin:0">${esc(T.title)}</h2><div class="muted" style="font-size:14px">${esc(T.discipline)} · до ${raceW(T,T.raceTo)} · сыграно ${done} из ${tot}</div></div></div>
  <div class="pult">

  </div>

}

const isCont=T=>/продолжением/i.test((T&&T.discipline)||'');const FB=8;
const raceW=(T,n)=>isCont(T)?n+' '+(n%10===1&&n%100!==11?'шара':'шаров'):n+' побед';
const raceL=T=>isCont(T)?'Игра до шаров':'Игра до побед';
const mrace=(T,m)=>{const r=T.results[m.id];return(r&&r.race)||(UI.pmRace&&UI.pmRace.mid===m.id&&UI.pmRace.v)||T.raceTo};
const hhmm=ts=>{const d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const mstart=r=>r.start||r.ts;
function mdur(r){if(!r||!mstart(r))return'';const end=r.done?(r.end||r.ts):r.paused?r.pauseAt:Date.now();const mn=Math.max(0,Math.round((end-mstart(r)-(r.pausedMs||0))/60000));return mn<60?mn+' мин':Math.floor(mn/60)+' ч '+String(mn%60).padStart(2,'0')+' мин'}
const PI=(()=>{const w=p=>`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;return{
  print:w('<path d="M7 9V4h10v5"/><rect x="4" y="9" width="16" height="8" rx="2"/><path d="M7 14h10v6H7z"/>'),
  board:w('<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>'),
  tp:w('<circle cx="12" cy="12" r="8.5"/><path d="M6 18 18 6"/>'),
  reset:w('<path d="M4 5v5h5"/><path d="M4.6 10A8 8 0 1 1 6 17"/>')}})();
function pmTools(T,m,live){
  if(UI.pmConfirm===m.id)return`<div class="pm-tools cf"><span>${T.match?'Сбросить счёт встречи?':'Сбросить счёт и вернуть матч в очередь?'}</span><button class="btn sm red" data-act="resetYes" data-mid="${m.id}">Сбросить</button><button class="btn sm ghost" data-act="resetNo">Нет</button></div>`;
  if(UI.tpM===m.id){const t=UI.tpSel||{},nm=x=>esc(sname(pname(CUR.T,x)));
    return`<div class="pm-tp"><div class="pm-tp-h">Техническое поражение</div><div class="fpills sm">${[['a',nm(m.a)],['b',nm(m.b)],['both','Обоим']].map(([k,l])=>`<button class="${t.who===k?'on':''}" data-act="tpWho" data-v="${k}">${l}</button>`).join('')}</div>
    <select id="tp-r" data-tpr="1">${Object.keys(TPR).map(k=>`<option value="${k}" ${t.reason===k?'selected':''}>${TPR[k][0].toUpperCase()+TPR[k].slice(1)}</option>`).join('')}</select>
    <div class="pm-acts" style="margin-top:12px"><button class="btn red" data-act="tpApply" data-mid="${m.id}" ${t.who?'':'disabled'}>Подтвердить</button><button class="btn ghost" data-act="tpCancel">Отмена</button></div></div>`}
  return`<div class="pm-tools"><button data-act="printM" data-mid="${m.id}">${PI.print}Протокол</button><button data-act="tpOpen" data-mid="${m.id}" title="Техническое поражение">${PI.tp}ТП</button><a href="#s-${T.id}-${m.id}" target="_blank" rel="noopener">${PI.board}Табло</a>${live?`<button class="rs" data-act="resetM" data-mid="${m.id}">${PI.reset}${T.match?'Сбросить встречу':'Сбросить матч'}</button>`:''}</div>`}

/* партии и шары (русская пирамида, партия до 8) */
function syncFr(r){r.fr=Array.isArray(r.fr)?r.fr.filter(f=>f&&(f.w==='a'||f.w==='b')):[];['a','b'].forEach(k=>{const want=r['s'+k]||0;let have=r.fr.filter(f=>f.w===k).length;
  while(have>want){let i=-1;for(let j=r.fr.length-1;j>=0;j--)if(r.fr[j].w===k){i=j;break}r.fr.splice(i,1);have--}while(have<want){r.fr.push({w:k});have++}})}
const frOf=r=>Array.isArray(r&&r.fr)?r.fr.filter(f=>f&&(f.w==='a'||f.w==='b')):[];
const frBalls=f=>Number.isFinite(f.a)&&Number.isFinite(f.b);
function pmFrames(T,m,off,rdy){const r=m.res||{};const fr=frOf(r);
  const sw=on=>`<button class="pm-sw${on?' on':''}" data-act="ballsOn" role="switch" aria-checked="${on}"><i></i>Шары по партиям</button>`;
  const chips=fr.some(frBalls)?`<div class="pm-frl"><span class="pm-frh">Партии</span>${fr.map((f,i)=>`<span class="${f.w}" title="Партия ${i+1}">${frBalls(f)?`${f.a}:${f.b}`:'—'}</span>`).join('')}</div>`:'';
  if(!T.balls)return`<div class="pm-bon">${sw(false)}<span class="mut2 pm-bh2">для официальных турниров</span></div>${chips}`;
  return`<div class="pm-bon bm">${sw(true)}<span class="pm-cap">партии</span><span class="pm-cap b">шары · партия ${fr.length+1} · до ${(f=>f?f.txt:FB)(foT(T,m))}</span></div>${chips}`}
function pmFoHTML(T,m,r,off){const inp=k=>`<label><span>${esc(sname(pname(T,m[k])))}</span><input id="pm-fo${k}" type="number" inputmode="numeric" min="1" max="15" value="${tgt(T,m,k)}" aria-label="До скольки шаров" data-act="pmFo" data-mid="${m.id}" ${off?'disabled':''}></label>`;
  return`<div class="pm-fo"><b>Фора · до скольки шаров партия</b>${inp('a')}${inp('b')}</div>`}
function pultHTML(T,m){const r=m.res||{};const c=club(T.clubId);const n=c.tables||6;const busy=blockedT(T,m.id);
  const stg=CUR&&CUR.b?stageMap(CUR.b)[m.id]:'';
  const fo=foT(T,m);const stg2=(stg||'')+(fo?(stg?' · ':'')+'фора '+fo.txt:'');
  const head=chip=>`<div class="pm-h"><div class="pm-ti"><b>${mNo(T,m)}</b>${stg2?`<span>${esc(stg2)}</span>`:''}</div>${chip}<button class="x" data-act="close" aria-label="Закрыть">×</button></div>`;
  if(m.state==='done'){const w=r.sa>r.sb?m.a:m.b;return`<div class="pm">${head('<span class="pm-chip">завершён</span>')}<div class="pm-done"><b>${esc(pname(T,w))}</b><span class="sc">${Math.max(r.sa,r.sb)} : ${Math.min(r.sa,r.sb)}</span><span class="mut">стол №${r.table||'—'}${mdur(r)?' · '+mdur(r):''}</span></div><div class="pm-acts"><button class="btn blue" data-act="close">Готово</button><button class="btn ghost" data-act="undo">Отменить</button></div>${pmTools(T,m,false)}</div>`}
  const rdy=m.state==='ready';const free=Array.from({length:n},(_,i)=>i+1).filter(k=>!busy.has(k));const off=rdy||r.paused;const R=mrace(T,m);
  const BM=T.balls&&!isCont(T);
  const rowB=side=>`<div class="pm-row bm"><span class="pm-n">${esc(pname(T,m[side]))}</span><input class="pm-s" type="number" inputmode="numeric" min="0" max="${R}" aria-label="Партии" ${off?'disabled':''} value="${rdy?0:r['s'+side]}" data-act="pmScore" data-mid="${m.id}" data-side="${side}"><button class="pm-b" ${off?'disabled':''} data-act="bl" data-mid="${m.id}" data-side="${side}" data-d="-1" aria-label="Убрать шар">−</button><b class="pm-bn">${rdy?0:(r['b'+side]||0)}</b><button class="pm-b plus" ${off?'disabled':''} data-act="bl" data-mid="${m.id}" data-side="${side}" data-d="1" aria-label="Шар">+</button></div>`;
  const row=side=>BM?rowB(side):`<div class="pm-row"><span class="pm-n">${esc(pname(T,m[side]))}</span><button class="pm-b" aria-label="Убрать партию" ${off?'disabled':''} data-act="sc" data-mid="${m.id}" data-side="${side}" data-d="-1">−</button><input class="pm-s" type="number" inputmode="numeric" min="0" max="${R}" aria-label="Счёт" ${off?'disabled':''} value="${rdy?0:r['s'+side]}" data-act="pmScore" data-mid="${m.id}" data-side="${side}"><button class="pm-b plus" aria-label="Партия" ${off?'disabled':''} data-act="sc" data-mid="${m.id}" data-side="${side}" data-d="1">+</button></div>`;
  const opts=rdy?free:free.concat(r.table?[r.table]:[]).sort((x,y)=>x-y);
  const tbl=opts.length?`<select id="pm-t" ${rdy?'':`data-act="pmTable" data-mid="${m.id}"`}>${opts.map(k=>`<option value="${k}" ${k===r.table?'selected':''}>№${k}${tvOf(T,k)?' · ТВ':''}</option>`).join('')}</select>`:'<b class="pm-v">все заняты</b>';
  const chip=rdy?'<span class="pm-chip ok">на очереди</span>':r.paused?'<span class="pm-chip">пауза</span>':'<span class="pm-chip live">● играют</span>';
  return`<div class="pm">${head(chip)}${row('a')}${row('b')}${isCont(T)?'':pmFrames(T,m,off,rdy)}${BM&&!rdy?pmFoHTML(T,m,r,off):''}
  <div class="pm-grid"><label><span>Стол</span>${tbl}</label><label><span>${raceL(T)}</span><input id="pm-r" type="number" inputmode="numeric" min="1" max="${isCont(T)?999:25}" value="${R}" data-act="pmRace" data-mid="${m.id}"></label>
  ${rdy?`<label style="grid-column:1/-1"><span>Трансляция встречи</span><input id="pm-vid" type="url" inputmode="url" placeholder="https://youtube.com/…"></label>`:`<label><span>Начало</span><input type="time" value="${hhmm(mstart(r))}" data-act="pmStart" data-mid="${m.id}"></label><label><span>Длительность</span><b class="pm-v">${mdur(r)}</b></label><label style="grid-column:1/-1"><span>Трансляция встречи</span><input type="url" inputmode="url" placeholder="https://youtube.com/…" value="${esc(r.video||'')}" data-act="pmVideo" data-mid="${m.id}"></label>`}</div>
  ${rdy?`<label class="chk sm pm-ap"><input type="checkbox" data-act="autoPr" ${T.autoPrint?'checked':''}><span>Печатать протокол при начале</span></label>`:''}
  <div class="pm-acts">${rdy?`<button class="btn blue" data-act="startM" data-mid="${m.id}" ${free.length?'':'disabled'}>Начать встречу</button>`:`<button class="btn ghost" data-act="pauseM" data-mid="${m.id}">${r.paused?'Продолжить':'Пауза'}</button><button class="btn blue" data-act="finishM" data-mid="${m.id}">Завершить встречу</button>`}</div>
  ${pmTools(T,m,!rdy)}</div>`}
function printProtos(T,mids){const b=build(T);CUR={T,b};const ms=mids.map(id=>b.all.find(x=>x.id===id)).filter(Boolean);if(!ms.length)return;
  let box=document.getElementById('printbox');if(!box){box=document.createElement('div');box.id='printbox';document.body.appendChild(box)}
  box.innerHTML=ms.map((m,i)=>`<div style="${i<ms.length-1?'page-break-after:always;break-after:page':''}">${protoHTML(T,m)}</div>`).join('');document.body.classList.add('pp');
  const off=()=>{document.body.classList.remove('pp');window.removeEventListener('afterprint',off)};window.addEventListener('afterprint',off);setTimeout(()=>window.print(),60)}

function protoFrames(T,m,r,d){const fr=frOf(r);const R=mrace(T,m);const max=2*R-1;const n=d?fr.length:Math.max(fr.length,max);if(!n||n>15)return'';

  const cell=(f,k)=>{if(!f||!frBalls(f))return`<td style="border:1px solid #D0D0D0;height:26px;text-align:center"></td>`;const w=f.w===k;return`<td style="border:1px solid #D0D0D0;height:26px;text-align:center;font-size:14px;${w?'font-weight:700;color:#111':'color:#4D4D4D'}">${f[k]}</td>`};

  return`<table style="width:100%;border-collapse:collapse;margin-top:22px;table-layout:fixed"><tr><td style="${th};text-align:left;width:34%">Партии · до ${FB} шаров</td>${cols.map(i=>`<td style="${th}">${i+1}</td>`).join('')}</tr>
  <tr><td style="font-size:13px;padding:4px 8px 4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(sname(pname(T,m.a)))}</td>${cols.map(i=>cell(fr[i],'a')).join('')}</tr>

function protoHTML(T,m){const r=m.res||{};const c=club(T.clubId);const fo0=foT(T,m);let stg=CUR&&CUR.b?stageMap(CUR.b)[m.id]:'';stg=(stg||'')+(fo0?(stg?' · ':'')+'фора '+fo0.txt:'');const d=m.state==='done';

  const row=(s,k,first)=>{const w=winId&&s.id===winId;const sc=r.tp?(tpOf(r,k)?'ТП':(d?'':'')):r['s'+k];
    const right=d?`<td style="width:96px;text-align:right;font-size:${r.tp?28:44}px;font-weight:700;color:${w?'#111':'#4D4D4D'};font-variant-numeric:tabular-nums">${sc??''}</td>`:`<td style="width:96px"><div style="height:56px;border:1.5px solid #111;border-radius:6px"></div></td>`;
    return`<tr${first?'':' style="border-top:1px solid #D0D0D0"'}><td style="padding:22px 0;font-size:22px;${d?(w?'font-weight:700;color:#111':'color:#4D4D4D'):'color:#111'}">${esc(pname(T,s))}</td><td style="text-align:right;padding-right:24px">${w?stamp:''}</td>${right}</tr>`};
  const det=(k,v)=>`<td style="width:25%;vertical-align:top;padding-right:16px"><div style="${lab}">${k}</div>${v?`<div style="margin-top:5px;font-size:15px;font-weight:600">${v}</div>`:`<div style="margin-top:5px;height:20px;border-bottom:1px solid #999"></div>`}</td>`;
  const tbl=r.table?'№'+r.table+(floorOf(c,r.table)?' · '+esc(floorOf(c,r.table)):''):'';

  const sign=(t,n)=>`<td style="width:33%;padding-right:32px;vertical-align:top"><div style="border-top:1px solid #111;padding-top:7px;font-size:10px;color:#6E6E6E">${t}</div><div style="margin-top:3px;font-size:13px;min-height:16px">${n||''}</div></td>`;
  const now=new Date();const stamp2=now.toLocaleDateString('ru-RU')+' '+hhmm(+now);
  const title=[stg,mNo(T,m)].filter(Boolean).join(' · ');
  return`<div style="font-family:Inter,Arial,sans-serif;color:#111;max-width:666px;margin:0 auto;padding:8px 0">
  <table style="width:100%;border-collapse:collapse"><tr><td style="vertical-align:middle"><img src="logo.svg" alt="kazbilliard" style="height:30px;display:block"></td><td style="text-align:right;vertical-align:middle"><div style="${lab}">Протокол встречи</div><div style="font-size:12px;color:#4D4D4D;margin-top:3px">${fdate(T.date)}</div></td></tr></table>
  <div style="margin-top:44px;font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1">${esc(title)}</div>

  ${isCont(T)||r.tp?'':protoFrames(T,m,r,d)}
  <table style="width:100%;border-collapse:collapse;margin-top:28px"><tr>${det('Стол',tbl)}${det('Игра до',raceW(T,mrace(T,m)))}${det('Время',d&&mstart(r)?hhmm(mstart(r))+' – '+hhmm(r.end||r.ts):'')}${det(r.tp&&d?'Причина':'Длительность',d?(r.tp?'ТП · '+TPR[r.reason||'no']:mdur(r)):'')}</tr></table>
