<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>kazbilliard — бильярдные турниры</title>
<meta name="description" content="Бильярдные турниры: сетки, счёт и столы в реальном времени.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F1F1;--card:#fff;--ink:#111111;--muted:#6E6E6E;--sub:#4D4D4D;--line:#E4E4E4;--line2:#D0D0D0;--soft:#F0F0F0;--accent:#1667FF;--accent-ink:#0F4FD9;--accent-soft:#E6EEFF;--live:#D93A26;--live-ink:#C4321F;--live-soft:#FDECEA;--ok:#0B7A47;--ok-soft:#E3F3EA;--gold:#111111;--gold-bg:#111111}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.45}
body{min-height:100vh;display:flex;flex-direction:column}body>main{flex:1 0 auto;width:100%;box-sizing:border-box}body>footer{width:100%;box-sizing:border-box;padding-top:20px!important}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.osw{font-family:Inter,sans-serif;text-transform:uppercase}
header.top{position:sticky;top:0;z-index:20;background:rgba(236,236,236,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:none;margin:0 auto;display:flex;align-items:center;gap:32px;padding:16px 20px}
.logo{font-family:Inter,sans-serif;font-weight:700;font-size:22px;letter-spacing:-.02em;text-decoration:none;display:flex;align-items:center;gap:10px}
.logo i{width:18px;height:18px;border-radius:50%;background:var(--accent);display:inline-block;box-shadow:inset -4px -4px 0 rgba(0,0,0,.22)}
.logo small{font-family:Inter,sans-serif;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
nav.main{display:flex;gap:26px;align-items:center;margin-left:auto}
nav.main a{text-decoration:none;font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--sub)}
nav.main a.on{color:var(--accent)}
nav.main a.cta{background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;text-transform:none;letter-spacing:0}
#ticker{background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
#ticker:empty{display:none}
.tick-in{max-width:none;margin:0 auto;padding:10px 32px;display:flex;align-items:center;gap:10px;white-space:nowrap}
.tick-live{background:var(--live);color:#fff;font-weight:700;font-size:13px;letter-spacing:.08em;padding:5px 12px;border-radius:10px}
.tick{display:inline-flex;align-items:center;gap:9px;padding:6px 14px;border:1px solid var(--line);border-radius:10px;font-size:13px;background:var(--bg);text-decoration:none}
.tick b{color:var(--muted);font-weight:600}.tick .s{font-family:Inter,sans-serif;font-weight:700;font-size:16px;color:var(--accent)}
main{max-width:none;margin:0 auto;padding:24px 20px 80px}
h1{font-family:Inter,sans-serif;font-size:52px;line-height:1.05;margin:0 0 10px;font-weight:500;letter-spacing:-.03em}
h2{font-family:Inter,sans-serif;font-size:26px;margin:0 0 14px;font-weight:500;letter-spacing:-.02em}
h3{font-family:Inter,sans-serif;font-size:17px;margin:0 0 10px;font-weight:600;letter-spacing:-.01em}
.muted{color:var(--muted)}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{opacity:.88}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line2)}
.btn.ghost:hover{border-color:var(--ink);opacity:1}
.btn.green{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.red{background:var(--live);border-color:var(--live)}
.btn.gold{background:var(--gold-bg);border-color:var(--gold-bg);color:var(--ink)}
.btn.sm{padding:7px 11px;font-size:13px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:22px}
.hero p{margin:0;color:var(--muted);max-width:520px}
.feat{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:56px}
.feat-main{flex:999 1 620px;min-width:0;border-radius:16px;padding:40px;background:#111;color:#fff;border:0;display:flex;flex-direction:column;gap:20px;min-height:380px;text-decoration:none}
.feat-main h1{font-size:60px;line-height:1.02}
.facts{display:flex;gap:30px;flex-wrap:wrap;margin-top:auto}
.facts div span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.facts div b{font-weight:600}
.feat-side{flex:1 1 360px;min-width:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:10px}
.lm{display:block;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 14px;text-decoration:none;cursor:pointer}
.lm .lt{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.lm .lt em{font-style:normal;color:var(--live-ink)}
.lm .lg{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;font-weight:600}
.lm .lg b{font-family:Inter,sans-serif;font-size:21px}
.search{border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;min-width:280px;outline:none}
.search:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;text-decoration:none;display:flex;gap:18px;transition:border-color .15s}
a.card:hover{border-color:var(--ink)}
.card .date{flex:0 0 62px;text-align:center;border-right:1px solid var(--line);padding-right:16px}
.card .date b{display:block;font-size:40px;line-height:1;font-weight:500;letter-spacing:-.03em}
.card .date span{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.card .body{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}
.card .disc{color:var(--accent);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.card .ttl{font-weight:700;font-size:17px;line-height:1.25}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:13px}
.st{font-size:11px;font-weight:700;padding:5px 10px;border-radius:10px;display:inline-flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.08em;align-self:flex-start}
.st.reg{background:#EDEDED;color:#333333}
.st.live{background:var(--live-soft);color:var(--live-ink)}
.st.live::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 1.4s infinite}
.st.done{background:var(--accent-soft);color:var(--accent)}
@keyframes pulse{50%{opacity:.25}}
.back{display:inline-block;margin-bottom:14px;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px}
.tband{background:#fff;border:0;border-radius:16px;padding:30px 32px 0;margin-bottom:24px}
.thead{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-end}
.thead h1{font-size:46px}
.th-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;min-height:36px}.th-top .back{margin:0}
.th-act{display:flex;gap:14px;align-items:center}
.th-act .ib{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--sub);cursor:pointer;padding:0}.th-act .ib:hover{background:#F5F5F5;color:var(--ink)}.th-act .ib.del:hover{color:var(--live-ink);border-color:#F2C9C3;background:var(--live-soft)}
.th-act{gap:8px}
body.gonly>header,body.gonly>#ticker,body.gonly>footer{display:none}body.gonly>main{padding:16px 16px 40px}
.go-h{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:10px}.go-h b{font-size:18px}.go-h span{color:var(--muted);font-size:14px}
.tmenu{position:relative}.tmenu .dots{border:1px solid var(--line);background:#fff;width:36px;height:36px;border-radius:10px;font-size:18px;line-height:1;color:var(--sub);cursor:pointer}.tmenu .dots:hover{background:#F5F5F5;color:var(--ink)}
.tmenu .pop{position:absolute;right:0;top:42px;z-index:20;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.10);padding:6px;min-width:180px}
.tmenu .pop button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:8px;font:inherit;font-size:14px;color:var(--live-ink);cursor:pointer}.tmenu .pop button:hover{background:var(--live-soft)}
.th-del{border:0;background:none;padding:0;font:inherit;font-size:13px;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px}.th-del:hover{color:var(--live-ink)}
.th-main{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap}.th-l{min-width:0;flex:1 1 520px}
.th-l h1{font-size:36px;line-height:1.1;margin:6px 0 0;letter-spacing:-.02em}
.th-over{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sub)}.th-over i{width:3px;height:3px;border-radius:50%;background:#C4C4C4}
.th-over .dot{width:8px;height:8px;border-radius:50%;background:#B5B5B5}.th-over .dot.live{background:var(--live);animation:pulse 1.4s infinite}.th-over .dot.done{background:var(--accent)}
.th-side{flex:0 0 260px;display:flex;flex-direction:column;gap:3px;font-size:14px;color:var(--sub)}
.th-side b.cn{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:2px}.th-side a{color:var(--accent-ink);text-decoration:none}.th-side a:hover{text-decoration:underline}
.th-side .lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.th-side b{font-size:30px;font-weight:600;line-height:1.1;letter-spacing:-.02em}.th-side b small{font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0}.th-side b.nm{font-size:20px}
.th-side .mut{font-size:13px;color:var(--muted)}
.th-side .bar{display:block;height:4px;border-radius:4px;background:#EDEDED;overflow:hidden;margin-top:8px}.th-side .bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
@media(max-width:760px){.th-side{flex:1 1 100%;padding:14px 0 0;border-left:0;border-top:1px solid var(--line)}.th-l h1{font-size:26px}}
.th-facts,.th-club{display:flex;flex-wrap:wrap;margin-top:12px;font-size:15px;color:var(--ink)}
.th-club{margin-top:6px;font-size:14px;color:var(--muted)}.th-club b{font-weight:600;color:var(--sub)}.th-club a{color:var(--accent-ink)}
.th-facts span+span::before,.th-club span+span::before{content:'·';margin:0 9px;color:#B5B5B5}
.tband .tabs{margin:26px -32px 0;padding:0 32px;gap:28px;border-top:1px solid var(--line)}
.tband .tabs button{background:none;border-radius:0;padding:16px 0 15px;font-size:15px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tband .tabs button:hover{color:var(--ink)}
.tband .tabs button.on{background:none;color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.tband .tabs .cnt{background:#F0F0F0;color:var(--sub);padding:1px 7px;font-weight:600}
.tband .tabs button.on .cnt{background:var(--ink);color:#fff}
@media(max-width:640px){.tband .tabs{margin:20px -18px 0;padding:0 18px;gap:22px}}
@media(max-width:640px){.th-title h1{font-size:26px}}
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.fgrid div{background:#fff;padding:12px 18px}.fgrid span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.fgrid b{font-weight:700;white-space:nowrap}
@media(max-width:900px){.fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tabs{display:flex;gap:8px;margin-top:26px;padding-bottom:24px;overflow-x:auto}
.tabs button{border:0;background:#F2F2F2;padding:11px 20px;font-weight:500;color:var(--ink);cursor:pointer;white-space:nowrap;font-size:15px;border-radius:10px}
.tabs button.on{background:var(--accent);color:#fff}
.tabs .cnt{font-size:11px;background:#fff;color:var(--accent-ink);border-radius:10px;padding:1px 7px;margin-left:5px}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px}
.seg button{border:0;background:transparent;border-radius:10px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer;color:var(--sub)}
.seg button.on{background:var(--ink);color:#fff;font-weight:700}
.sec{margin-bottom:34px}
.sec-h{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sec-h h2{margin:0}
.withside{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
.withside>.wm{flex:999 1 720px;min-width:0}
.withside>aside{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:16px}
/* bracket */
.bracket{display:flex;gap:28px;overflow-x:auto;padding:4px 4px 18px}
.round{display:flex;flex-direction:column;flex:0 0 212px}
.round-title small{display:block;margin-top:3px;font-size:11px;font-weight:400;letter-spacing:0;text-transform:none;color:#BFBFBF;white-space:nowrap}
.round-title{font-family:Inter,sans-serif;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:6px}
.round-body{flex:1;display:flex;flex-direction:column}
.pair{flex:1;display:flex;flex-direction:column;position:relative}
.slot{flex:1;display:flex;flex-direction:column;justify-content:center;position:relative;padding:18px 0}
.round-body{padding-top:8px}
.slot.hid{visibility:hidden}
.sw{position:relative;transition:opacity .12s}

.m .row.hlr{background:var(--accent-soft)}.m .row.hlr .n{font-weight:600;color:var(--accent-ink)}
.round.conn .slot.hlo::after,.round.instub .slot.hli::before{border-top-color:var(--accent);border-top-width:2px;margin-top:-.5px}
.round.conn .pair.join.hlt::before{border-color:var(--accent);border-width:2px 2px 0 0}
.round.conn .pair.join.hlb::after{border-color:var(--accent);border-width:0 2px 2px 0}
.lz{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.zoomer{display:inline-flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.zoomer button{border:0;background:none;height:34px;min-width:34px;padding:0 8px;font:inherit;font-size:16px;color:var(--ink);cursor:pointer}.zoomer button:hover{background:#F2F2F2}
.zoomer .zv{font-size:12px;font-weight:600;min-width:50px;color:var(--sub);border-left:1px solid var(--line);border-right:1px solid var(--line)}
.bracket,.uni{touch-action:pan-x pan-y}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.cap{position:absolute;left:2px;right:0;top:100%;margin-top:3px;font-size:11px;line-height:14px;color:#BFBFBF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uni{position:relative;overflow-x:auto;padding:4px 4px 18px}
.uni-in{display:flex;align-items:stretch;gap:28px;width:max-content}
.bk-in{display:flex;gap:28px;flex:0 0 auto;margin:0 auto}
.uni-in{margin:0 auto}

.uni .bracket{overflow:visible;flex:0 0 auto;padding:0}
.uni .slot{padding:26px 0}
.uni .mir{transform:scaleX(-1)}
.uni .mir .round-title,.uni .mir .sw{transform:scaleX(-1)}
.uni .mir .round:first-child .slot::before{content:'';position:absolute;left:-14px;top:50%;width:14px;border-top:1px solid var(--line2)}
.uni .ub .round:first-child .slot::before{content:'';position:absolute;left:-14px;top:50%;width:14px;border-top:1px solid var(--line2)}
.uni .po-start .round-title{color:var(--accent)}
.uni-side>aside{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}
.uni-side>aside>.panel{flex:1 1 300px}
.round.conn .slot::after{content:'';position:absolute;right:-14px;top:50%;width:14px;border-top:1px solid var(--line2)}
.round.instub .slot::before{content:'';position:absolute;left:-14px;top:50%;width:14px;border-top:1px solid var(--line2)}
.round.conn .pair.join::after{content:'';position:absolute;right:-14px;top:25%;bottom:25%;border-right:1px solid var(--line2)}
.m{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;transition:border-color .15s}
.m:hover{border-color:var(--ink)}
.m-top{display:flex;justify-content:space-between;padding:5px 11px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:#F6F6F6;border-bottom:1px solid var(--line)}
.m .row{display:grid;grid-template-columns:minmax(0,1fr) 28px;align-items:center;gap:6px;padding:4px 12px;font-size:14.5px}
.m .row+.row{border-top:1px solid #F0F0F0}
.mw{position:relative}
.m-meta{position:absolute;left:2px;right:2px;bottom:100%;margin-bottom:3px;display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11px;line-height:14px;color:#BFBFBF;white-space:nowrap}
.m-meta>span:first-child{display:inline-flex;align-items:center;gap:5px}
.mst.live{color:var(--live-ink);font-weight:600}.mst.ok{color:var(--ok);font-weight:600}
.mk{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;box-sizing:border-box;border-radius:5px;color:#fff;font-size:10px;font-weight:700;line-height:1;font-style:normal}.mk.g{background:var(--ok)}.mk.b{background:var(--accent)}
.cap{display:flex;align-items:center;gap:5px}.cap i{width:6px}.cap b:not(.mk){color:var(--ink);font-weight:600}
.capd .slot{padding:26px 0}
.final-box .mw{margin-top:22px}
.m .seed{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.m .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-weight:400}
.m .sc{font-family:Inter,sans-serif;font-weight:600;font-size:14.5px;text-align:right;font-variant-numeric:tabular-nums}
.m .win .sc{color:var(--ok)}.m .lose .sc{color:var(--live-ink)}
.m .tbd .n{color:#A6A6A6;font-style:italic}
.m.s-live{border-color:var(--live);background:#FEF6F5}
.m.s-live .m-top{color:var(--live-ink);background:var(--live-soft)}
.m.s-ready{border-color:var(--ok);background:#F2FAF5}
.m.s-live .row+.row,.m.s-ready .row+.row{border-top-color:rgba(0,0,0,.07)}.m.s-ready .m-top{color:var(--ok);background:var(--ok-soft)}
.m.s-bye{cursor:default}
.m .row.wo .n{color:#B5B5B5}
.final-box{max-width:260px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{font-style:normal}.legend .r{color:var(--live-ink)}.legend .g{color:var(--ok)}
/* tables */
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px}
table.tb{width:100%;border-collapse:collapse;font-size:13.5px}
.tb th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:700;padding:6px;border-bottom:1px solid var(--line)}
.tb td{padding:9px 6px;border-bottom:1px solid #EFEFEF}
.tb td.c,.tb th.c{text-align:center}
.tb th.srt button{border:0;background:none;padding:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:4px}.tb th.srt button:hover,.tb th.srt.on button{color:var(--ink)}.tb th.srt i{font-style:normal;width:8px}
.tb td.r,.tb th.r{text-align:right}.tb td.mut{color:var(--muted);font-size:12.5px;white-space:nowrap}.tb td.sc{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}

<script>
/* ============ constants ============ */
const LS='kiy-proto-v3';
const RANKS=['б/р','3 разряд','2 разряд','1 разряд','КМС','МС','МСМК','ЗМС'];
const FORMATS={de:'До двух поражений',se:'Олимпийская система',gp:'Группы + плей-офф',rr:'Круговая система'};
const FORMAT_DESC={de:'Выбывание после двух поражений: верхняя и нижняя сетки, суперфинал',se:'Проиграл — выбыл. Быстро и просто',gp:'Круговой турнир в группах, лучшие выходят в олимпийскую сетку',rr:'Каждый играет с каждым, место — по таблице'};
const DISC=['Свободная пирамида','Комбинированная пирамида','Динамичная пирамида','Московская пирамида','Пул 8','Пул 9','Пул 10','Снукер'];
const LETTERS='ABCDEFGHIJKLMNOP';
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const fdate=d=>{if(!d)return'';const [y,m,dd]=d.split('-');return +dd+' '+MONTHS[+m-1]+' '+y};

/* ============ engine ============ */
const BYE={t:'bye'};
const P=id=>({t:'p',id});
const TBD=label=>({t:'tbd',label});
function nextPow2(n){let p=1;while(p<n)p*=2;return p}
function seedOrder(N){let a=[1];while(a.length<N){const L=a.length*2,b=[];for(const x of a)b.push(x,L+1-x);a=b}return a}
function placeSeeds(slots){const N=nextPow2(Math.max(2,slots.length));return seedOrder(N).map(s=>slots[s-1]||BYE)}

function mk(ctx,id,a,b,meta){
  const no=++ctx.no;const m={id,no,a,b,meta:meta||{}};
  const r=ctx.T.results[id];
  if(a.t==='bye'&&b.t==='bye'){m.state='bye';m.winner=BYE;m.loser=BYE}
  else if(a.t==='bye'&&b.t==='p'){m.state='bye';m.winner=b;m.loser=BYE}
  else if(b.t==='bye'&&a.t==='p'){m.state='bye';m.winner=a;m.loser=BYE}
  else if(a.t==='p'&&b.t==='p'){
    const ok=r&&r.a===a.id&&r.b===b.id;
    if(ok&&r.done){m.state='done';m.res=r;const aw=r.sa>r.sb;m.winner=aw?a:b;m.loser=aw?b:a}
    else{m.state=ok&&(r.live||r.call)?'live':'ready';if(ok&&(r.live||r.call))m.res=r;m.winner=TBD('Поб. №'+no);m.loser=TBD('Пр. №'+no)}
  } else {
    m.state='wait';m.winner=TBD('Поб. №'+no);
    m.loser=(a.t==='bye'||b.t==='bye')?BYE:TBD('Пр. №'+no);
  }
  ctx.all.push(m);return m;
}
function seTitle(k){if(k===0)return'Финал';if(k===1)return'1/2 финала';return'1/'+(2**k)+' финала'}
function buildSE(ctx,slots,prefix){
  const rounds=[];let cur=slots,r=0;const R=Math.log2(slots.length);
  while(cur.length>1){r++;const ms=[],next=[];
    for(let i=0;i<cur.length;i+=2){const m=mk(ctx,prefix+r+'-'+i/2,cur[i],cur[i+1]);ms.push(m);next.push(m.winner)}
    rounds.push({title:seTitle(R-r),matches:ms});cur=next}
  return{rounds,champ:cur[0]};
}
function playoffK(T,n){const N=nextPow2(Math.max(2,n));let K=T.playoff==null?0:T.playoff;if(K==='auto')K=N>=32?8:4;K=+K||0;while(K>N/2)K/=2;return K>=4?K:0}
function buildDE(ctx,ids){
  const slots=placeSeeds(ids.map(P));const N=slots.length,R=Math.log2(N);const K=playoffK(ctx.T,ids.length);
  const Wr=K?R-Math.log2(K)+1:R;
  const compact=N>=16&&ids.length<=N*3/4,sd=seedOrder(N),kept=[];
  const wb=[],losers=[];let cur=slots;
  for(let r=1;r<=Wr;r++){const ms=[],nx=[],ls=[];
    for(let i=0;i<cur.length;i+=2){
      if(compact&&r===1&&Math.min(sd[i],sd[i+1])<=N/4){nx.push(cur[i].t==='bye'?cur[i+1]:cur[i]);ls.push(BYE);continue}
      const m=mk(ctx,'w'+r+'-'+i/2,cur[i],cur[i+1]);ms.push(m);nx.push(m.winner);ls.push(m.loser);if(r===1)kept.push(m.loser)}
    wb.push({title:!K&&r===R?'Финал верхней':'Раунд '+r,matches:ms});losers.push(ls);cur=nx}
  const lb=[];let lc=[];
  if(R>=2){let lr=0;
    const run=(a,pairs)=>{lr++;const ms=[],nx=[];for(let i=0;i<pairs.length;i++){const m=mk(ctx,'l'+lr+'-'+i,pairs[i][0],pairs[i][1]);ms.push(m);nx.push(m.winner)}lb.push({title:'Раунд '+(lb.length+1),matches:ms});return nx};
    const pairUp=arr=>{const p=[];for(let i=0;i<arr.length;i+=2)p.push([arr[i],arr[i+1]]);return p};
    if(compact){lr=1;lc=kept}else lc=run(0,pairUp(losers[0]));
    for(let k=2;k<=Wr;k++){const drop=losers[k-1].slice();if(k%2===0)drop.reverse();
      lc=run(0,lc.map((s,i)=>[s,drop[i]]));
      if(k<Wr)lc=run(0,pairUp(lc));}
    if(!K)lb[lb.length-1].title='Финал нижней';
  } else lc=[losers[0][0]];
  if(K){const h=K/2,sh=h/2;const ps=[];const T=ctx.T;
    const perm=T.draw&&Array.isArray(T.poPerm)&&T.poPerm.length===h?T.poPerm:null;
    for(let i=0;i<h;i++){ps.push(cur[i],T.draw?(perm?lc[perm[i]]:TBD('По жребию')):lc[h===2&&Wr%2===0?i:i^1])}
    const se=buildSE(ctx,ps,'p');return{wb,lb,rounds:se.rounds,champ:se.champ,K,name:(compact?N*3/4:N)+'-'+K,draw:!!T.draw,drawn:!!perm,up:cur,low:lc}}
  const wbChamp=cur[0],lbChamp=lc[0];
  const gf=mk(ctx,'gf',wbChamp,lbChamp);let final=gf,gf2=null;
  if(gf.state==='done'&&lbChamp.t==='p'&&gf.winner.id===lbChamp.id){gf2=mk(ctx,'gf2',wbChamp,lbChamp);final=gf2}
  return{wb,lb,gf,gf2,final};
}
function maybeDraw(T){
  if(T.format!=='de'||!T.draw||T.poPerm||T.status==='reg')return false;
  const b=build(T);if(!b.K||![...b.up,...b.low].every(s=>s.t==='p'))return false;
  const met=new Set();b.all.forEach(m=>{if(m.state==='done')met.add(m.a.id+'|'+m.b.id).add(m.b.id+'|'+m.a.id)});
  const h=b.K/2;let best=null,bs=1e9;
  for(let k=0;k<200&&bs>0;k++){const p=[...Array(h).keys()];for(let i=h-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]]}
    const sc=p.filter((x,i)=>met.has(b.up[i].id+'|'+b.low[x].id)).length;if(sc<bs){bs=sc;best=p}}
  T.poPerm=best;return true;
}
function deName(n,po){n=Math.max(2,n);const N=nextPow2(n),K=playoffK({playoff:po},n);return K?((N>=16&&n<=N*3/4?N*3/4:N)+'-'+K):''}
function buildRR(ctx,ids,prefix){
  let arr=ids.slice();if(arr.length%2)arr.push(null);const n=arr.length;const rounds=[],matches=[];
  for(let r=0;r<n-1;r++){const ms=[];
    for(let i=0;i<n/2;i++){const a=arr[i],b=arr[n-1-i];if(a&&b){const m=mk(ctx,prefix+a+'-'+b,P(a),P(b));ms.push(m);matches.push(m)}}
    rounds.push({title:'Тур '+(r+1),matches:ms});arr=[arr[0],arr[n-1],...arr.slice(1,n-1)]}
  const st={};ids.forEach(id=>st[id]={id,pl:0,w:0,l:0,ff:0,fa:0});
  for(const m of matches)if(m.state==='done'){const r=m.res,A=st[m.a.id],B=st[m.b.id];
    A.pl++;B.pl++;A.ff+=r.sa;A.fa+=r.sb;B.ff+=r.sb;B.fa+=r.sa;if(r.sa>r.sb){A.w++;B.l++}else{B.w++;A.l++}}
  const h2h=(x,y)=>{const m=matches.find(m=>m.state==='done'&&((m.a.id===x&&m.b.id===y)||(m.a.id===y&&m.b.id===x)));return m?(m.winner.id===x?-1:1):0};
  const standings=Object.values(st).sort((x,y)=>y.w-x.w||((y.ff-y.fa)-(x.ff-x.fa))||y.ff-x.ff||h2h(x.id,y.id));
  return{rounds,matches,standings,complete:matches.every(m=>m.state==='done'),ids};
}
function buildGP(ctx,T,ids){
  const G=T.groups.count,K=T.groups.advance;
  const gIds=Array.from({length:G},()=>[]);
  ids.forEach((id,i)=>{const row=Math.floor(i/G);const g=row%2===0?i%G:G-1-i%G;gIds[g].push(id)});
  const groups=gIds.map((gi,k)=>Object.assign({name:'Группа '+LETTERS[k],letter:LETTERS[k]},buildRR(ctx,gi,'g'+k+'-')));
  const labels=[];for(let p=1;p<=K;p++){const ord=[...Array(G).keys()];if(p%2===0)ord.reverse();ord.forEach(g=>labels.push({g,p}))}
  const N=nextPow2(Math.max(2,labels.length));const placed=seedOrder(N).map(s=>labels[s-1]||null);
  for(let i=0;i<N;i+=2){const a=placed[i],b=placed[i+1];
    if(a&&b&&a.g===b.g){for(let j=0;j<N;j+=2){if(j===i)continue;const c=placed[j],d=placed[j+1];
      if(c&&d&&d.g!==a.g&&c.g!==b.g){placed[i+1]=d;placed[j+1]=b;break}}}}
  const slots=placed.map(l=>{if(!l)return BYE;const gr=groups[l.g];
    if(gr.complete){const row=gr.standings[l.p-1];return row?P(row.id):BYE}return TBD(gr.letter+l.p)});
  const se=buildSE(ctx,slots,'p');
  return{groups,rounds:se.rounds,champ:se.champ,K};
}
function build(T){
  const ctx={T,no:0,all:[]};const out={all:ctx.all};
  if(T.status==='reg'){out.finished=false;return out}
  const ids=T.players.map(p=>p.id);
  if(T.format==='se'){const se=buildSE(ctx,placeSeeds(ids.map(P)),'s');out.rounds=se.rounds;out.champ=se.champ;out.finished=se.champ.t==='p'}
  else if(T.format==='de'){Object.assign(out,buildDE(ctx,ids));out.finished=out.K?out.champ.t==='p':out.final.winner.t==='p'}
  else if(T.format==='rr'){const g=buildRR(ctx,ids,'r');out.groups=[Object.assign({name:'Таблица'},g)];out.finished=g.complete}
  else{Object.assign(out,buildGP(ctx,T,ids));out.finished=out.champ.t==='p'}
  if(out.finished)out.places=computePlaces(T,out);
  return out;
}
function computePlaces(T,b){
  const res=[];let place=1;
  const add=(ids,label)=>{if(!ids.length)return;res.push({from:place,to:place+ids.length-1,ids,label});place+=ids.length};
  const losersOf=rd=>rd.matches.map(m=>m.loser).filter(s=>s.t==='p').map(s=>s.id);
  if(T.format==='rr'){b.groups[0].standings.forEach(r=>add([r.id]));return res}
  if(T.format==='de'){if(b.K){add([b.champ.id]);[...b.rounds].reverse().forEach(rd=>add(losersOf(rd)))}else{add([b.final.winner.id]);add(losersOf({matches:[b.final]}))}[...b.lb].reverse().forEach(rd=>add(losersOf(rd)));return res}
  add([b.champ.id]);[...b.rounds].reverse().forEach(rd=>add(losersOf(rd)));
  if(T.format==='gp'){const maxP=Math.max(...b.groups.map(g=>g.standings.length));
    for(let p=b.K+1;p<=maxP;p++)add(b.groups.map(g=>g.standings[p-1]).filter(Boolean).map(r=>r.id),'не вышли из группы')}
  return res;
}

/* ============ storage & demo ============ */
let S={clubs:[],tournaments:[],session:null,admin:false,adminExists:true,email:''};
const SB_URL='https://dhsrklircobualygdacz.supabase.co',SB_KEY='sb_publishable_CoPq83PXPQWtfTzMECB7jg_VI-tjPyM';
let sb=null,saveQ=Promise.resolve(),pending=0;const OWN_TS={};
const SNAP={t:{},own:{},club:null,roster:null};
const pub=p=>({id:p.id,first:p.first,last:p.last,name:p.name,city:p.city,rank:p.rank,birth:String(p.birth||'').slice(0,4)});
function tData(T){const d=Object.assign({},T);delete d.id;delete d.clubId;return d}
function tFromRow(r){return Object.assign({},r.data,{id:r.id,clubId:r.club_id})}
function save(){if(S.session)S.tournaments.forEach(t=>{if(t.clubId===S.session&&t.draw&&!t.poPerm&&maybeDraw(t))setTimeout(()=>toast('Жеребьёвка олимпийки проведена'),50)});pending++;saveQ=saveQ.then(doSave).catch(()=>{}).then(()=>{pending--})}
async function doSave(){
  if(!S.session||!sb)return;const jobs=[];const me=S.clubs.find(c=>c.id===S.session);
  for(const T of S.tournaments){if(T.clubId!==S.session)continue;const j=JSON.stringify(tData(T));
    if(SNAP.t[T.id]===undefined)jobs.push(sb.from('tournament').insert({id:T.id,club_id:T.clubId,data:tData(T)}).then(r=>{if(!r.error){SNAP.t[T.id]=j;SNAP.own[T.id]=1;OWN_TS[T.id]=Date.now()}return r}));
    else if(SNAP.t[T.id]!==j)jobs.push(sb.from('tournament').update({data:tData(T)}).eq('id',T.id).then(r=>{if(!r.error){SNAP.t[T.id]=j;OWN_TS[T.id]=Date.now()}return r}))}
  for(const id of Object.keys(SNAP.own)){if(!S.tournaments.some(t=>t.id===id))jobs.push(sb.from('tournament').update({deleted_at:new Date().toISOString()}).eq('id',id).then(r=>{if(!r.error){delete SNAP.own[id];delete SNAP.t[id]}return r}))}
  if(me){const cj=JSON.stringify([me.name,me.city,me.tables,me.address,me.phone,me.instagram]);if(SNAP.club!==cj)jobs.push(sb.from('club').update({name:me.name,city:me.city,tables:me.tables,address:me.address||'',phone:me.phone||'',instagram:me.instagram||''}).eq('id',me.id).then(r=>{if(!r.error)SNAP.club=cj;return r}));
    const rj=JSON.stringify(me.roster||[]);if(SNAP.roster!==rj)jobs.push(sb.from('club_private').update({roster:me.roster||[]}).eq('club_id',me.id).then(r=>{if(!r.error)SNAP.roster=rj;return r}))}
  const res=await Promise.all(jobs);if(res.some(r=>r&&r.error)){console.error(res.filter(r=>r&&r.error).map(r=>r.error));toast('Не сохранилось — проверьте интернет и повторите')}
}
async function loadSession(){
  S.session=null;S.admin=false;S.email='';SNAP.club=null;SNAP.roster=null;
  const {data}=await sb.auth.getSession();const u=data&&data.session&&data.session.user;
  if(!u)return;S.email=u.email||'';
  const [mc,ad]=await Promise.all([sb.rpc('my_club'),sb.rpc('is_admin')]);

  if(mc.data){const c=S.clubs.find(x=>x.id===mc.data);if(c){S.session=c.id;const r=await sb.from('club_private').select('roster').eq('club_id',c.id).maybeSingle();c.roster=(r.data&&r.data.roster)||[];
    SNAP.club=JSON.stringify([c.name,c.city,c.tables,c.address,c.phone,c.instagram]);SNAP.roster=JSON.stringify(c.roster)}}
  SNAP.own={};S.tournaments.forEach(T=>{if(T.clubId===S.session)SNAP.own[T.id]=1});
}
async function load(){
  const [c,t,ae]=await Promise.all([sb.from('club').select('id,name,city,tables,address,phone,instagram').is('deleted_at',null).order('created_at'),sb.from('tournament').select('id,club_id,data').is('deleted_at',null),sb.rpc('admin_exists')]);
  if(c.error||t.error)throw (c.error||t.error);
  S.clubs=c.data.map(x=>Object.assign({roster:[]},x));S.tournaments=t.data.map(tFromRow);S.adminExists=ae.data!==false;
  SNAP.t={};S.tournaments.forEach(T=>SNAP.t[T.id]=JSON.stringify(tData(T)));
  await loadSession();
}
function softRender(){const ae=document.activeElement;const typing=ae&&/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName);if(typing||location.hash==='#create')return;if(document.getElementById('modal').classList.contains('open')){if(UI.pm){render();refreshPult()}return}render()}
function onRemote(p){
  const r=p.new;if(!r||!r.id)return;const i=S.tournaments.findIndex(t=>t.id===r.id);
  if(r.deleted_at){if(i>=0){S.tournaments.splice(i,1);delete SNAP.t[r.id];delete SNAP.own[r.id];softRender()}return}
  if(r.club_id===S.session&&(pending>0||Date.now()-(OWN_TS[r.id]||0)<3000))return;
  const T=tFromRow(r),j=JSON.stringify(tData(T));if(SNAP.t[r.id]===j&&i>=0)return;
  SNAP.t[r.id]=j;if(i>=0){const old=S.tournaments[i];Object.keys(old).forEach(k=>delete old[k]);Object.assign(old,T)}else S.tournaments.unshift(T);
  if(r.club_id===S.session)SNAP.own[r.id]=1;softRender();
}

const NAMES=['Ержан Сагындыков','Данияр Омаров','Алексей Ким','Нурлан Жумабаев','Руслан Ахметов','Сергей Петренко','Тимур Касымов','Арман Нуртаев','Виктор Ли','Бауыржан Есенов','Олжас Абдрахманов','Дмитрий Соколов','Айдос Мухамеджанов','Максим Волков','Ильяс Тулегенов','Канат Бекмуратов','Асхат Иманов','Павел Никитин','Ербол Сейткали','Марат Исмаилов','Азамат Калиев','Евгений Морозов','Жандос Ахмедьяров','Андрей Цой'];
const CITIES=['Алматы','Астана','Актобе','Шымкент','Караганда'];
function mkPlayer(first,last,birth,city,rank){return{id:uid(),first,last,name:last+' '+first,birth,city,rank:rank||'б/р'}}
function mkPlayers(n,off,city){return Array.from({length:n},(_,i)=>{const [f,l]=NAMES[(i+off)%NAMES.length].split(' ');
  const y=1972+((i*7+off*3)%34),m=1+((i*5+off)%12),d=1+((i*11+off)%28);
  return mkPlayer(f,l,`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,i%3===0?CITIES[(i+off)%CITIES.length]:city,RANKS[Math.max(0,Math.min(7,6-Math.floor((i/n)*7)))])})}
function playResult(T,m,live){
  const n=T.players.length,ia=T.players.findIndex(p=>p.id===m.a.id),ib=T.players.findIndex(p=>p.id===m.b.id);
  const pa=.5+(ib-ia)/(2.4*n);const aw=Math.random()<pa;const lo=Math.floor(Math.random()*T.raceTo);
  if(live){const x=Math.floor(Math.random()*T.raceTo),y=Math.floor(Math.random()*T.raceTo);
    T.results[m.id]={a:m.a.id,b:m.b.id,sa:x,sb:y,live:true,done:false,table:live,ts:Date.now()};return}
  T.results[m.id]={a:m.a.id,b:m.b.id,sa:aw?T.raceTo:lo,sb:aw?lo:T.raceTo,done:true,ts:Date.now()+Math.random()};
}

}

function pultHTML(T,m){const r=m.res||{};const c=club(T.clubId);const n=c.tables||6;const busy=busyTables(T.clubId,m.id);
  const head=`<div class="dlg-h"><h3>Матч №${m.no}${r.table&&m.state!=='ready'?` · стол ${r.table}`:''}</h3><button class="x" data-act="close">×</button></div>`;
  if(m.state==='done'){const w=r.sa>r.sb?m.a:m.b;return head+`<div class="pm-done"><span class="mut">Матч завершён</span><b>${esc(pname(T,w))}</b><span class="sc">${Math.max(r.sa,r.sb)} : ${Math.min(r.sa,r.sb)}</span></div><div class="acts"><button class="btn blue" data-act="close">Готово</button><button class="btn ghost" data-act="undo">Отменить последнюю партию</button></div>`}
  if(m.state==='ready')return head+`<div class="pm-vs"><b>${esc(pname(T,m.a))}</b><span>—</span><b>${esc(pname(T,m.b))}</b></div><div class="pm-lbl">Выберите стол</div><div class="pm-tables">${Array.from({length:n},(_,i)=>i+1).map(k=>busy.has(k)?`<button disabled><b>${k}</b><small>занят</small></button>`:`<button data-act="callT" data-mid="${m.id}" data-t="${k}"><b>${k}</b><small>свободен</small></button>`).join('')}</div>`;
  const row=side=>`<div class="pm-row"><span class="pm-n">${esc(sname(pname(T,m[side])))}</span><button class="pm-b" aria-label="Убрать партию" data-act="sc" data-mid="${m.id}" data-side="${side}" data-d="-1">−</button><span class="pm-s">${r['s'+side]}</span><button class="pm-b plus" aria-label="Партия" data-act="sc" data-mid="${m.id}" data-side="${side}" data-d="1">+</button></div>`;
  return`<div class="pm"><div class="pm-h"><span>№${m.no} · стол ${r.table||'—'} · до ${T.raceTo}</span><button class="x" data-act="close" aria-label="Закрыть">×</button></div>${row('a')}${row('b')}${r.sa+r.sb===0?`<button class="pm-un" data-act="uncall" data-mid="${m.id}">убрать со стола</button>`:''}</div>`}
function refreshPult(){if(!UI.pm||!CUR||!document.getElementById('modal').classList.contains('open'))return;const m=CUR.b.all.find(x=>x.id===UI.pm);if(!m||m.state==='wait'){closeModal();return}openModal(pultHTML(CUR.T,m))}
/* ============ modal ============ */
function openModal(html){const m=document.getElementById('modal');m.innerHTML=`<div class="dlg">${html}</div>`;m.classList.add('open')}
function closeModal(){UI.pm=null;const m=document.getElementById('modal');m.classList.remove('open');m.innerHTML=''}
function openMatch(mid){
  const {T,b}=CUR;const m=b.all.find(x=>x.id===mid);if(!m)return;const own=isOwner(T);
  const head=`<div class="dlg-h"><h3>Матч №${m.no}</h3><button class="x" data-act="close">×</button></div>`;
  if(m.state==='wait'||m.state==='bye'){openModal(head+`<p>${esc(pname(T,m.a))} — ${esc(pname(T,m.b))}</p><p class="muted">${m.state==='bye'?'Свободный проход: соперника нет, игрок проходит дальше без игры.':'Матч ждёт, пока определятся оба соперника.'}</p>`);return}
  const r=m.res||{};
  if(!own){openModal(head+`<div class="score"><span class="nm">${esc(pname(T,m.a))}</span><span style="font-size:22px;font-weight:800;text-align:center">${m.res?r.sa:'—'}</span></div><div class="score"><span class="nm">${esc(pname(T,m.b))}</span><span style="font-size:22px;font-weight:800;text-align:center">${m.res?r.sb:'—'}</span></div><p class="muted" style="font-size:13px">${m.state==='live'?`Идёт${r.table?' за столом '+r.table:''}. `:''}${m.state==='done'?'Матч завершён.':m.state==='ready'?'Ожидает вызова к столу.':''} Игра до ${T.raceTo} побед.</p>`);return}
  if(m.state!=='done'||(UI.undo&&UI.undo.mid===m.id&&UI.undo.tid===T.id)){UI.pm=m.id;openModal(pultHTML(T,m));return}
  openModal(head+`<p class="muted" style="margin-top:0;font-size:13px">Матч сыгран. Здесь можно исправить счёт, если ошиблись. Игра до ${T.raceTo} побед.</p>
  <div class="score"><span class="nm">${esc(pname(T,m.a))}</span><input id="sa" type="number" min="0" inputmode="numeric" value="${r.sa??''}"></div>
  <div class="score"><span class="nm">${esc(pname(T,m.b))}</span><input id="sb" type="number" min="0" inputmode="numeric" value="${r.sb??''}"></div>
  <input type="hidden" id="tbl" value="${r.table??''}">
  <div class="err" id="m-err"></div>
  <div class="acts"><button class="btn blue" data-act="saveRes" data-mid="${m.id}">Сохранить счёт</button><button class="btn ghost" data-act="clearRes" data-mid="${m.id}">Переиграть матч</button></div>
  <p class="muted" style="font-size:12px;margin-bottom:0">Если победитель изменится, следующие матчи с его участием сбросятся.</p>`);
}

  saveClub(){const c=club(S.session);const v=id=>document.getElementById(id).value.trim();const n=Math.floor(+v('cl-tables'));
    if(!v('cl-name')||!(n>=1&&n<=60)){document.getElementById('cl-err').textContent='Проверьте название и число столов (1–60)';return}
    c.name=v('cl-name');c.city=v('cl-city');c.tables=n;c.address=v('cl-addr').slice(0,200);c.phone=v('cl-phone').slice(0,40);c.instagram=v('cl-insta').replace(/^@/,'').replace(/^https?:\/\/(www\.)?instagram\.com\//,'').replace(/\/.*$/,'').slice(0,60);UI.clubEdit=false;save();render();toast('Сохранено')},
  start(){const T=CUR.T;const e=document.getElementById('start-err');
    if(T.format==='gp'&&T.groups.advance>=Math.floor(T.players.length/T.groups.count)){e.textContent='Из группы выходит слишком много игроков для такого состава';return}
    if(T.players.length<minPlayers(T)){e.textContent='Мало участников';return}
    if(T.seedMode==='random'){for(let i=T.players.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[T.players[i],T.players[j]]=[T.players[j],T.players[i]]}}
    T.status='live';T.results={};UI.tab[T.id]='grid';save();render();toast('Сетка построена')}
};
document.addEventListener('click',e=>{if(UI.tmenu&&!(e.target.closest&&e.target.closest('.tmenu'))){UI.tmenu=null;render()}
  if(e.target.id==='modal'){closeModal();return}
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  if(a==='fmt'||a==='seedMode'||a==='callSel')return;
  if(A[a]){e.preventDefault();A[a](el)}
});
document.addEventListener('change',e=>{
  const a=e.target.dataset&&e.target.dataset.act;
  if(a==='fmt')A.fmt();
  if(a==='seedMode'){CUR.T.seedMode=e.target.value;save()}
  if(a==='callSel'&&e.target.value){A.callT({dataset:{mid:e.target.dataset.mid,t:e.target.value}})}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){UI.filter.q=e.target.value;renderGrid()}if(e.target.id==='rs-q')renderRoster();if(e.target.id==='wq'&&UI.wiz){UI.wiz.q=e.target.value;renderWizRoster()}if(e.target.dataset&&e.target.dataset.w&&UI.wiz){UI.wiz[e.target.dataset.w]=e.target.value;const t=document.getElementById('ws-title');if(t&&e.target.dataset.w==='title')t.textContent=e.target.value||'Без названия'}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Enter'&&e.target.id==='lg-pass'){const b=document.querySelector('[data-act=login]');b&&b.click()}if(e.key==='Enter'&&document.getElementById('sa')&&document.getElementById('modal').classList.contains('open')){const b=document.querySelector('[data-act=saveRes]');b&&b.click()}});
window.addEventListener('hashchange',()=>{closeModal();UI.confirm=null;render();window.scrollTo(0,0)});
boot();
</script>
</body>
