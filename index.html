.hl-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;padding-left:18px;border-left:1px solid var(--line)}.hl-m b{font-size:16px;font-weight:600;line-height:1.3}.hl-m span{font-size:13.5px;color:var(--muted)}
.hl-r{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right}.hl-r em{font-style:normal;font-size:14px;color:var(--ink)}.hl-r span{font-size:13px;color:var(--muted)}

<script>
/* ============ constants ============ */
const LS='kiy-proto-v3';
const RANKS=['б/р','3 разряд','2 разряд','1 разряд','КМС','МС','МСМК','ЗМС'];
const FORMATS={de:'До двух поражений',se:'Олимпийская система',gp:'Группы + плей-офф',rr:'Круговая система'};
const FORMAT_DESC={de:'Выбывание после двух поражений: верхняя и нижняя сетки, суперфинал',se:'Проиграл — выбыл. Быстро и просто',gp:'Круговой турнир в группах, лучшие выходят в олимпийскую сетку',rr:'Каждый играет с каждым, место — по таблице'};
const DISC=['Свободная пирамида','Комбинированная пирамида','Динамичная пирамида','Московская пирамида','Пул 8','Пул 9','Пул 10','Снукер'];
const LETTERS='ABCDEFGHIJKLMNOP';
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const CATS=['Клубный','Городской','Республиканский','Международный'];
const okUrl=u=>!u||/^https?:\/\/[^\s]+\.[^\s]+$/i.test(u.trim());
const normUrl=u=>{u=(u||'').trim();if(u&&!/^https?:\/\//i.test(u))u='https://'+u;return u};
function fdates(T){const a=T.date,b=T.dateEnd;if(!b||b===a)return fdate(a);const [y1,m1,d1]=a.split('-'),[y2,m2,d2]=b.split('-');
  if(y1===y2&&m1===m2)return +d1+'–'+(+d2)+' '+MONTHS[+m1-1]+' '+y1;if(y1===y2)return +d1+' '+MONTHS[+m1-1]+' – '+(+d2)+' '+MONTHS[+m2-1]+' '+y1;return fdate(a)+' – '+fdate(b)}
const isPub=T=>T.pub!==false;
const fdate=d=>{if(!d)return'';const [y,m,dd]=d.split('-');return +dd+' '+MONTHS[+m-1]+' '+y};

/* ============ engine ============ */
const BYE={t:'bye'};
const P=id=>({t:'p',id});
const TBD=label=>({t:'tbd',label});
const TPR={no:'неявка',refuse:'отказ от игры',dq:'дисквалификация',other:'другое'};
const tpOf=(r,side)=>r&&r.tp&&(r.tp==='both'||r.tp===side);
const scTxt=(r,side)=>r&&r.tp?(tpOf(r,side)?'<em class="tp">ТП</em>':''):(r?r['s'+side]:'');
function nextPow2(n){let p=1;while(p<n)p*=2;return p}
function seedOrder(N){let a=[1];while(a.length<N){const L=a.length*2,b=[];for(const x of a)b.push(x,L+1-x);a=b}return a}
function placeSeeds(slots){const N=nextPow2(Math.max(2,slots.length));return seedOrder(N).map(s=>slots[s-1]||BYE)}

function mk(ctx,id,a,b,meta){
  const no=++ctx.no;const m={id,no,a,b,meta:meta||{}};
  const r=ctx.T.results[id];
  if(a.t==='bye'&&b.t==='bye'){m.state='bye';m.winner=BYE;m.loser=BYE}
  else if(a.t==='bye'&&b.t==='p'){m.state='bye';m.winner=b;m.loser=BYE}
  else if(b.t==='bye'&&a.t==='p'){m.state='bye';m.winner=a;m.loser=BYE}
  else if(a.t==='p'&&b.t==='p'){
    const ok=r&&r.a===a.id&&r.b===b.id;
    if(ok&&r.done){m.state='done';m.res=r;if(r.tp==='both'){m.winner=BYE;m.loser=BYE}else{const aw=r.tp?r.tp==='b':r.sa>r.sb;m.winner=aw?a:b;m.loser=aw?b:a}}
    else{m.state=ok&&(r.live||r.call)?'live':'ready';if(ok&&(r.live||r.call))m.res=r;m.winner=TBD('Поб. №'+no);m.loser=TBD('Пр. №'+no)}
  } else {
    m.state='wait';m.winner=TBD('Поб. №'+no);
    m.loser=(a.t==='bye'||b.t==='bye')?BYE:TBD('Пр. №'+no);
  }
  ctx.all.push(m);return m;
}
function seTitle(k){if(k===0)return'Финал';if(k===1)return'1/2 финала';return'1/'+(2**k)+' финала'}
function buildSE(ctx,slots,prefix){
  const rounds=[];let cur=slots,r=0;const R=Math.log2(slots.length);
  while(cur.length>1){r++;const ms=[],next=[];
    for(let i=0;i<cur.length;i+=2){const m=mk(ctx,prefix+r+'-'+i/2,cur[i],cur[i+1]);ms.push(m);next.push(m.winner)}
    rounds.push({title:seTitle(R-r),matches:ms});cur=next}
  let third=null;if(ctx.T.third&&rounds.length>=2){const sf=rounds[rounds.length-2].matches;if(sf.length===2)third=mk(ctx,prefix+'3p',sf[0].loser,sf[1].loser)}
  return{rounds,champ:cur[0],third};
}
function playoffK(T,n){const N=nextPow2(Math.max(2,n));let K=T.playoff==null?0:T.playoff;if(K==='auto')K=N>=32?8:4;K=+K||0;while(K>N/2)K/=2;return K>=4?K:0}
function buildDE(ctx,ids){
  const slots=placeSeeds(ids.map(P));const N=slots.length,R=Math.log2(N);const K=playoffK(ctx.T,ids.length);
  const Wr=K?R-Math.log2(K)+1:R;
  const compact=N>=16&&ids.length<=N*3/4,sd=seedOrder(N),kept=[];
  const wb=[],losers=[];let cur=slots;
  for(let r=1;r<=Wr;r++){const ms=[],nx=[],ls=[];
    for(let i=0;i<cur.length;i+=2){
      if(compact&&r===1&&Math.min(sd[i],sd[i+1])<=N/4){nx.push(cur[i].t==='bye'?cur[i+1]:cur[i]);ls.push(BYE);continue}
      const m=mk(ctx,'w'+r+'-'+i/2,cur[i],cur[i+1]);ms.push(m);nx.push(m.winner);ls.push(m.loser);if(r===1)kept.push(m.loser)}
    wb.push({title:!K&&r===R?'Финал верхней':'Раунд '+r,matches:ms});losers.push(ls);cur=nx}
  const lb=[];let lc=[];
  if(R>=2){let lr=0;
    const run=(a,pairs)=>{lr++;const ms=[],nx=[];for(let i=0;i<pairs.length;i++){const m=mk(ctx,'l'+lr+'-'+i,pairs[i][0],pairs[i][1]);ms.push(m);nx.push(m.winner)}lb.push({title:'Раунд '+(lb.length+1),matches:ms});return nx};
    const pairUp=arr=>{const p=[];for(let i=0;i<arr.length;i+=2)p.push([arr[i],arr[i+1]]);return p};
    if(compact){lr=1;lc=kept}else lc=run(0,pairUp(losers[0]));
    for(let k=2;k<=Wr;k++){const drop=losers[k-1].slice();if(k%2===0)drop.reverse();
      lc=run(0,lc.map((s,i)=>[s,drop[i]]));
      if(k<Wr)lc=run(0,pairUp(lc));}
    if(!K)lb[lb.length-1].title='Финал нижней';
  } else lc=[losers[0][0]];
  if(K){const h=K/2,sh=h/2;const ps=[];const T=ctx.T;
    const perm=T.draw&&Array.isArray(T.poPerm)&&T.poPerm.length===h?T.poPerm:null;
    for(let i=0;i<h;i++){ps.push(cur[i],T.draw?(perm?lc[perm[i]]:TBD('По жребию')):lc[h===2&&Wr%2===0?i:i^1])}
    const se=buildSE(ctx,ps,'p');return{wb,lb,rounds:se.rounds,champ:se.champ,third:se.third,K,name:(compact?N*3/4:N)+'-'+K,draw:!!T.draw,drawn:!!perm,up:cur,low:lc}}
  const wbChamp=cur[0],lbChamp=lc[0];
  const gf=mk(ctx,'gf',wbChamp,lbChamp);let final=gf,gf2=null;
  if(gf.state==='done'&&lbChamp.t==='p'&&gf.winner.id===lbChamp.id){gf2=mk(ctx,'gf2',wbChamp,lbChamp);final=gf2}
  return{wb,lb,gf,gf2,final};
}
function maybeDraw(T){
  if(T.format!=='de'||!T.draw||T.poPerm||T.status==='reg')return false;
  const b=build(T);if(!b.K||![...b.up,...b.low].every(s=>s.t==='p'))return false;
  const met=new Set();b.all.forEach(m=>{if(m.state==='done')met.add(m.a.id+'|'+m.b.id).add(m.b.id+'|'+m.a.id)});
  const h=b.K/2;let best=null,bs=1e9;
  for(let k=0;k<200&&bs>0;k++){const p=[...Array(h).keys()];for(let i=h-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]]}
    const sc=p.filter((x,i)=>met.has(b.up[i].id+'|'+b.low[x].id)).length;if(sc<bs){bs=sc;best=p}}
  T.poPerm=best;return true;
}
function deName(n,po){n=Math.max(2,n);const N=nextPow2(n),K=playoffK({playoff:po},n);return K?((N>=16&&n<=N*3/4?N*3/4:N)+'-'+K):''}
function buildRR(ctx,ids,prefix){
  let arr=ids.slice();if(arr.length%2)arr.push(null);const n=arr.length;const rounds=[],matches=[];
  for(let r=0;r<n-1;r++){const ms=[];
    for(let i=0;i<n/2;i++){const a=arr[i],b=arr[n-1-i];if(a&&b){const m=mk(ctx,prefix+a+'-'+b,P(a),P(b));ms.push(m);matches.push(m)}}
    rounds.push({title:'Тур '+(r+1),matches:ms});arr=[arr[0],arr[n-1],...arr.slice(1,n-1)]}
  const st={};ids.forEach(id=>st[id]={id,pl:0,w:0,l:0,ff:0,fa:0});
  for(const m of matches)if(m.state==='done'){const r=m.res,A=st[m.a.id],B=st[m.b.id];
    A.pl++;B.pl++;A.ff+=r.sa;A.fa+=r.sb;B.ff+=r.sb;B.fa+=r.sa;if(r.tp==='both'){A.l++;B.l++}else if(r.tp?r.tp==='b':r.sa>r.sb){A.w++;B.l++}else{B.w++;A.l++}}
  const h2h=(x,y)=>{const m=matches.find(m=>m.state==='done'&&((m.a.id===x&&m.b.id===y)||(m.a.id===y&&m.b.id===x)));return m&&m.winner.t==='p'?(m.winner.id===x?-1:1):0};
  const standings=Object.values(st).sort((x,y)=>y.w-x.w||((y.ff-y.fa)-(x.ff-x.fa))||y.ff-x.ff||h2h(x.id,y.id));
  return{rounds,matches,standings,complete:matches.every(m=>m.state==='done'),ids};
}
function buildGP(ctx,T,ids){
  const G=T.groups.count,K=T.groups.advance;
  const gIds=Array.from({length:G},()=>[]);
  ids.forEach((id,i)=>{const row=Math.floor(i/G);const g=row%2===0?i%G:G-1-i%G;gIds[g].push(id)});
  const groups=gIds.map((gi,k)=>Object.assign({name:'Группа '+LETTERS[k],letter:LETTERS[k]},buildRR(ctx,gi,'g'+k+'-')));
  const labels=[];for(let p=1;p<=K;p++){const ord=[...Array(G).keys()];if(p%2===0)ord.reverse();ord.forEach(g=>labels.push({g,p}))}
  const N=nextPow2(Math.max(2,labels.length));const placed=seedOrder(N).map(s=>labels[s-1]||null);
  for(let i=0;i<N;i+=2){const a=placed[i],b=placed[i+1];
    if(a&&b&&a.g===b.g){for(let j=0;j<N;j+=2){if(j===i)continue;const c=placed[j],d=placed[j+1];
      if(c&&d&&d.g!==a.g&&c.g!==b.g){placed[i+1]=d;placed[j+1]=b;break}}}}
  const slots=placed.map(l=>{if(!l)return BYE;const gr=groups[l.g];
    if(gr.complete){const row=gr.standings[l.p-1];return row?P(row.id):BYE}return TBD(gr.letter+l.p)});
  const se=buildSE(ctx,slots,'p');
  return{groups,rounds:se.rounds,champ:se.champ,third:se.third,K};
}
function build(T){
  const ctx={T,no:0,all:[]};const out={all:ctx.all};
  if(T.status==='reg'){out.finished=false;return out}
  const ids=T.players.map(p=>p.id);
  if(T.format==='se'){const se=buildSE(ctx,placeSeeds(ids.map(P)),'s');out.rounds=se.rounds;out.champ=se.champ;out.third=se.third;out.finished=se.champ.t==='p'}
  else if(T.format==='de'){Object.assign(out,buildDE(ctx,ids));out.finished=out.K?out.champ.t==='p':out.final.winner.t==='p'}
  else if(T.format==='rr'){const g=buildRR(ctx,ids,'r');out.groups=[Object.assign({name:'Таблица'},g)];out.finished=g.complete}
  else{Object.assign(out,buildGP(ctx,T,ids));out.finished=out.champ.t==='p'}
  if(out.finished&&out.third&&out.third.state!=='done'&&out.third.state!=='bye')out.finished=false;
  if(out.finished)out.places=computePlaces(T,out);
  return out;
}
function computePlaces(T,b){
  const res=[];let place=1;
  const add=(ids,label)=>{if(!ids.length)return;res.push({from:place,to:place+ids.length-1,ids,label});place+=ids.length};
  const losersOf=rd=>rd.matches.map(m=>m.loser).filter(s=>s.t==='p').map(s=>s.id);
  const po=()=>{const rs=b.rounds;for(let i=rs.length-1;i>=0;i--){if(b.third&&i===rs.length-2)[b.third.winner,b.third.loser].filter(x=>x.t==='p').forEach(x=>add([x.id]));else add(losersOf(rs[i]))}};
  if(T.format==='rr'){b.groups[0].standings.forEach(r=>add([r.id]));return res}
  if(T.format==='de'){if(b.K){add([b.champ.id]);po()}else{add([b.final.winner.id]);add(losersOf({matches:[b.final]}))}[...b.lb].reverse().forEach(rd=>add(losersOf(rd)));return res}
  add([b.champ.id]);po();
  if(T.format==='gp'){const maxP=Math.max(...b.groups.map(g=>g.standings.length));
    for(let p=b.K+1;p<=maxP;p++)add(b.groups.map(g=>g.standings[p-1]).filter(Boolean).map(r=>r.id),'не вышли из группы')}
  return res;
}

function merge3(b,l,s){b=b||{};l=l||{};s=s||{};const out={};const ks=o=>Object.keys(o||{});
  for(const k of new Set([...ks(b),...ks(l),...ks(s)])){if(k==='results')continue;const v=jsq(l[k])!==jsq(b[k])?l[k]:s[k];if(v!==undefined)out[k]=v}
  const rb=b.results||{},rl=l.results||{},rs=s.results||{},R={};
  for(const k of new Set([...ks(rb),...ks(rl),...ks(rs)])){const v=jsq(rl[k])!==jsq(rb[k])?rl[k]:rs[k];if(v!==undefined)R[k]=v}
  out.results=R;return out}
function applyData(T,d){Object.keys(T).forEach(k=>{if(k!=='id'&&k!=='clubId')delete T[k]});Object.assign(T,JSON.parse(jsq(d)))}
async function saveT1(T){const base=JSON.parse(SNAP.t[T.id]);const sent=tData(T);
  const {data:row,error}=await sb.from('tournament').select('data').eq('id',T.id).maybeSingle();if(error)return{error};
  const merged=merge3(base,sent,(row&&row.data)||base);const r=await sb.from('tournament').update({data:merged}).eq('id',T.id);
  if(!r.error){SNAP.t[T.id]=jsq(merged);OWN_TS[T.id]=Date.now();const now=tData(T);const fin=merge3(sent,now,merged);if(jsq(fin)!==jsq(now)){applyData(T,fin);softRender()}}
  return r}
async function doSave(){
  if(!S.session||!sb)return;const jobs=[];const me=S.clubs.find(c=>c.id===S.session);
  for(const T of S.tournaments){if(T.clubId!==S.session)continue;const j=JSON.stringify(tData(T));
    if(SNAP.t[T.id]===undefined)jobs.push(sb.from('tournament').insert({id:T.id,club_id:T.clubId,data:tData(T)}).then(r=>{if(!r.error){SNAP.t[T.id]=j;SNAP.own[T.id]=1;OWN_TS[T.id]=Date.now()}return r}));
    else if(SNAP.t[T.id]!==j)jobs.push(saveT1(T))}
  for(const id of Object.keys(SNAP.own)){if(!S.tournaments.some(t=>t.id===id))jobs.push(sb.from('tournament').update({deleted_at:new Date().toISOString()}).eq('id',id).then(r=>{if(!r.error){delete SNAP.own[id];delete SNAP.t[id]}return r}))}
  if(me){const cj=JSON.stringify([me.name,me.city,me.tables,me.address,me.phone,me.instagram]);if(SNAP.club!==cj)jobs.push(sb.from('club').update({name:me.name,city:me.city,tables:me.tables,address:me.address||'',phone:me.phone||'',instagram:me.instagram||''}).eq('id',me.id).then(r=>{if(!r.error)SNAP.club=cj;return r}));
    const rj=JSON.stringify(me.roster||[]);if(SNAP.roster!==rj)jobs.push(sb.from('club_private').update({roster:me.roster||[]}).eq('club_id',me.id).then(r=>{if(!r.error)SNAP.roster=rj;return r}))}
  const res=await Promise.all(jobs);if(res.some(r=>r&&r.error)){console.error(res.filter(r=>r&&r.error).map(r=>r.error));toast('Не сохранилось — проверьте интернет и повторите')}
}

    SNAP.club=JSON.stringify([c.name,c.city,c.tables,c.address,c.phone,c.instagram]);SNAP.roster=JSON.stringify(c.roster)}}

async function load(){
  const [c,t,ae]=await Promise.all([sb.from('club').select('id,name,city,tables,address,phone,instagram').is('deleted_at',null).order('created_at'),sb.from('tournament').select('id,club_id,data').is('deleted_at',null),sb.rpc('admin_exists')]);

function softRender(){const ae=document.activeElement;const typing=ae&&/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName);if(typing||location.hash==='#create')return;if(document.getElementById('modal').classList.contains('open')){if(UI.pm){render();refreshPult()}return}render()}
function onRemote(p){
  const r=p.new;if(!r||!r.id)return;const i=S.tournaments.findIndex(t=>t.id===r.id);
  if(r.deleted_at){if(i>=0){S.tournaments.splice(i,1);delete SNAP.t[r.id];delete SNAP.own[r.id];softRender()}return}
  const T=tFromRow(r),j=JSON.stringify(tData(T));if(SNAP.t[r.id]===j&&i>=0)return;
  if(r.club_id===S.session&&i>=0&&SNAP.t[r.id]!==undefined){const cur=S.tournaments[i];const loc=tData(cur);const m=merge3(JSON.parse(SNAP.t[r.id]),loc,tData(T));SNAP.t[r.id]=j;
    if(jsq(m)!==jsq(loc)){applyData(cur,m);softRender()}if(jsq(m)!==j)save();return}
  SNAP.t[r.id]=j;if(i>=0){const old=S.tournaments[i];Object.keys(old).forEach(k=>delete old[k]);Object.assign(old,T)}else S.tournaments.unshift(T);
  if(r.club_id===S.session)SNAP.own[r.id]=1;softRender();
}

const NAMES=['Ержан Сагындыков','Данияр Омаров','Алексей Ким','Нурлан Жумабаев','Руслан Ахметов','Сергей Петренко','Тимур Касымов','Арман Нуртаев','Виктор Ли','Бауыржан Есенов','Олжас Абдрахманов','Дмитрий Соколов','Айдос Мухамеджанов','Максим Волков','Ильяс Тулегенов','Канат Бекмуратов','Асхат Иманов','Павел Никитин','Ербол Сейткали','Марат Исмаилов','Азамат Калиев','Евгений Морозов','Жандос Ахмедьяров','Андрей Цой'];
const CITIES=['Алматы','Астана','Актобе','Шымкент','Караганда'];
function mkPlayer(first,last,birth,city,rank,x){return Object.assign({id:uid(),first,last,name:last+' '+first,birth,city,rank:rank||'б/р'},x||{})}
function mkPlayers(n,off,city){return Array.from({length:n},(_,i)=>{const [f,l]=NAMES[(i+off)%NAMES.length].split(' ');
  const y=1972+((i*7+off*3)%34),m=1+((i*5+off)%12),d=1+((i*11+off)%28);
  return mkPlayer(f,l,`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,i%3===0?CITIES[(i+off)%CITIES.length]:city,RANKS[Math.max(0,Math.min(7,6-Math.floor((i/n)*7)))])})}
function playResult(T,m,live){
  const n=T.players.length,ia=T.players.findIndex(p=>p.id===m.a.id),ib=T.players.findIndex(p=>p.id===m.b.id);
  const pa=.5+(ib-ia)/(2.4*n);const aw=Math.random()<pa;const lo=Math.floor(Math.random()*T.raceTo);
  if(live){const x=Math.floor(Math.random()*T.raceTo),y=Math.floor(Math.random()*T.raceTo);
    T.results[m.id]={a:m.a.id,b:m.b.id,sa:x,sb:y,live:true,done:false,table:live,ts:Date.now()};return}
  T.results[m.id]={a:m.a.id,b:m.b.id,sa:aw?T.raceTo:lo,sb:aw?lo:T.raceTo,done:true,ts:Date.now()+Math.random()};
}
function simulate(T,count,live){
  for(let i=0;i<count;i++){const ready=build(T).all.filter(m=>m.state==='ready');if(!ready.length)break;playResult(T,ready[0]);maybeDraw(T)}
  for(let i=0;i<(live||0);i++){const ready=build(T).all.filter(m=>m.state==='ready');if(!ready.length)break;playResult(T,ready[0],2+i*3)}
}

  fmt(){const v=document.querySelector('input[name=fmt]:checked').value;document.getElementById('gp-opts').style.display=v==='gp'?'grid':'none'},

  drawOpen(){const T=CUR.T;const st=T.players.filter(p=>p.seed).length;UI.dr={k:st&&st<=T.players.length/2&&[2,4,8,16].includes(st)?st:0,how:st?'star':'rank'};openModal(drawHTML(T))},
  drawIn(el){const u=UI.dr;if(el.dataset.dr==='k')u.k=+el.value;else u.how=el.value;openModal(drawHTML(CUR.T))},
  drawApply(){const T=CUR.T,u=UI.dr;const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
    let seeds=[];if(u.k){const pool=sh(T.players.slice());seeds=u.how==='rank'?pool.sort((x,y)=>RANKS.indexOf(y.rank)-RANKS.indexOf(x.rank)).slice(0,u.k):pool.filter(p=>p.seed);if(u.how==='rank')T.players.forEach(p=>p.seed=seeds.includes(p))}
    const rest=sh(T.players.filter(p=>!seeds.includes(p)));seeds.forEach((p,i)=>p.no=i+1);rest.forEach((p,i)=>p.no=seeds.length+i+1);
    T.players.sort((x,y)=>x.no-y.no);T.drawn=true;T.seeds=seeds.length;UI.psort={k:'pos',d:1};save();closeModal();render();toast(seeds.length?`Жеребьёвка проведена, сеяных ${seeds.length}`:'Жеребьёвка проведена')},
  seedP(el){const T=CUR.T;const p=T.players.find(x=>x.id===el.dataset.id);if(!p)return;p.seed=!p.seed;save();render()},
  editP(el){const T=CUR.T;if(!isOwner(T))return;const p=T.players.find(x=>x.id===el.dataset.id);if(p)openModal(editPHTML(T,p))},
  saveP(el){const T=CUR.T,c=club(T.clubId);const p=T.players.find(x=>x.id===el.dataset.id);if(!p)return;const v=id=>document.getElementById(id).value.trim();const e=document.getElementById('ep-err');
    const last=v('ep-last'),first=v('ep-first'),y=+v('ep-birth');if(!last||!first){e.textContent='Введите фамилию и имя';return}if(!(y>=1920&&y<=new Date().getFullYear())){e.textContent='Укажите год рождения';return}
    const upd={last,first,name:last+' '+first,sex:v('ep-sex'),birth:String(y),country:v('ep-country'),city:v('ep-city'),club:v('ep-club'),rank:v('ep-rank')};Object.assign(p,upd);
    const r=(c.roster||[]).find(x=>x.id===p.id);if(r)Object.assign(r,upd);save();closeModal();render();toast('Сохранено')},
  drawT(){const T=CUR.T;const a=T.players.map((p,i)=>i+1);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
    T.players.forEach((p,i)=>p.no=a[i]);T.players.sort((x,y)=>x.no-y.no);T.drawn=true;UI.psort={k:'pos',d:1};save();render();toast('Жеребьёвка проведена')},
  schOpen(){const T=CUR.T;UI.tmenu=null;UI.sch={third:!!T.third,format:T.format||'de',playoff:T.playoff===undefined?'auto':T.playoff,gc:(T.groups&&T.groups.count)||4,ga:(T.groups&&T.groups.advance)||2,race:T.raceTo||4};if(document.querySelector('.pop'))render();openModal(schHTML(T))},
  schIn(el){const u=UI.sch,k=el.dataset.sch;if(k==='grid'){const [f,p]=el.value.split(':');u.format=f;if(f==='de')u.playoff=+p;openModal(schHTML(CUR.T));return}u[k]=k==='third'?el.checked:k==='playoff'?(el.value==='auto'?'auto':+el.value):el.value;openModal(schHTML(CUR.T))},
  schSet(el){const u=UI.sch,k=el.dataset.k,v=el.dataset.v;u[k]=k==='playoff'?(v==='auto'?'auto':+v):v;openModal(schHTML(CUR.T))},
  schNum(el){const u=UI.sch,k=el.dataset.k,lim={gc:[2,16],ga:[1,8],race:[1,25]}[k];u[k]=Math.max(lim[0],Math.min(lim[1],u[k]+(+el.dataset.d)));openModal(schHTML(CUR.T))},
  schApply(){const T=CUR.T,u=UI.sch,e=document.getElementById('sch-err');if(!isOwner(T))return;if(T.status==='reg'&&(!T.drawn||T.players.some(p=>!p.no))){e.textContent='Сначала проведите жеребьёвку';return}if(Object.keys(T.results||{}).length&&T.status!=='reg'){e.textContent='Матчи уже сыграны — схему менять нельзя';return}
    if(u.format==='gp'&&u.ga>=Math.floor(T.players.length/u.gc)){e.textContent='Из группы выходит слишком много игроков для такого состава';return}
    T.format=u.format;T.playoff=u.format==='de'?u.playoff:undefined;T.third=!!u.third&&u.format!=='rr';T.groups={count:u.gc,advance:u.ga};T.raceTo=u.race;T.seedMode='list';delete T.draw;delete T.poPerm;
    T.players.sort((x,y)=>(x.no||1e9)-(y.no||1e9));T.status='live';T.results={};UI.tab[T.id]='grid';save();closeModal();render();toast('Сетка построена')},
  printPlaces(){const T=CUR.T,b=CUR.b;if(!b.places)return;const c=club(T.clubId);let box=document.getElementById('printbox');if(!box){box=document.createElement('div');box.id='printbox';document.body.appendChild(box)}
    box.innerHTML=`<div style="font-family:Inter,Arial,sans-serif;color:#111;padding:20px"><div style="font-size:11px;color:#777;text-transform:uppercase;letter-spacing:.08em">Итоговые места</div><div style="font-size:20px;font-weight:700;margin:4px 0 2px">${esc(T.title)}</div><div style="font-size:13px;color:#444;margin-bottom:14px">${esc(c.name||'')} · ${esc(T.discipline)} · ${fdates(T)} · ${esc(tFmt(T,b))}</div><table style="width:100%;border-collapse:collapse;font-size:14px">${b.places.map(p=>p.ids.map(id=>`<tr><td style="border-bottom:1px solid #ccc;padding:7px 4px;width:90px;font-weight:700">${p.from===p.to?p.from:p.from+'–'+p.to}</td><td style="border-bottom:1px solid #ccc;padding:7px 4px">${esc(pname(T,P(id)))}</td></tr>`).join('')).join('')}</table>${(T.judges||[]).filter(j=>j.role!=='hall').map(j=>`<div style="margin-top:40px;font-size:12px;color:#555">Главный судья ____________________ ${esc(j.name)}</div>`).join('')}</div>`;
    document.body.classList.add('pp');const off=()=>{document.body.classList.remove('pp');window.removeEventListener('afterprint',off)};window.addEventListener('afterprint',off);window.print()},
  tplList(){withExcel(async()=>{try{const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('Участники');ws.columns=[['Фамилия',18],['Имя',14],['Пол',6],['Год',8],['Страна',14],['Город',14],['Клуб',18],['Звание',10]].map(([header,width])=>({header,width}));ws.getRow(1).font={bold:true};
    ws.addRow(['Иванов','Сергей','М',1990,'Казахстан','Алматы','Chimba','КМС']);const buf=await wb.xlsx.writeBuffer();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));a.download='Шаблон участников.xlsx';a.click()}catch(e){toast('Не удалось сохранить файл')}})},
  printList(){const T=CUR.T;let box=document.getElementById('printbox');if(!box){box=document.createElement('div');box.id='printbox';document.body.appendChild(box)}
    box.innerHTML=listHTML(T);document.body.classList.add('pp');const off=()=>{document.body.classList.remove('pp');window.removeEventListener('afterprint',off)};window.addEventListener('afterprint',off);window.print()},
  xlsList(){const T=CUR.T;withExcel(async()=>{try{const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('Участники');
    ws.columns=[['№',6],['Фамилия',18],['Имя',14],['Пол',6],['Год',8],['Страна',14],['Город',14],['Клуб',18],['Звание',10]].map(([header,width])=>({header,width}));ws.getRow(1).font={bold:true};
    [...T.players].sort((a,b)=>(a.no||1e9)-(b.no||1e9)).forEach((p,i)=>ws.addRow([T.drawn?(p.no||''):i+1,p.last,p.first,p.sex||'',byear(p),p.country||'',p.city||'',p.club||'',p.rank||'']));
    const buf=await wb.xlsx.writeBuffer();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));a.download=('Участники '+T.title).replace(/[\\/:*?"<>|]/g,'')+'.xlsx';a.click()}catch(err){toast('Не удалось сохранить файл')}})},
  impList(){const f=document.getElementById('imp-file');if(!f)return;f.value='';f.onchange=()=>{const file=f.files[0];if(!file)return;withExcel(async()=>{try{const T=CUR.T,c=club(T.clubId);const wb=new ExcelJS.Workbook();await wb.xlsx.load(await file.arrayBuffer());const ws=wb.worksheets[0];
      const hdr={};ws.getRow(1).eachCell((cell,i)=>{const h=String(cell.text||'').toLowerCase();[['last','фамил'],['first','имя'],['sex','пол'],['birth','год'],['birth','рожд'],['country','стран'],['city','город'],['club','клуб'],['rank','звани']].forEach(([k,w])=>{if(h.includes(w)&&!hdr[k])hdr[k]=i})});
      if(!hdr.last||!hdr.first){toast('В первой строке нужны колонки «Фамилия» и «Имя»');return}let ok=0,skip=0;
      ws.eachRow((row,ri)=>{if(ri===1)return;const g=k=>hdr[k]?String(row.getCell(hdr[k]).text||'').trim():'';const last=g('last'),first=g('first');if(!last||!first)return;
        const y=(g('birth').match(/(19|20)\d\d/)||[''])[0];const sx=/^ж|^f|^w/i.test(g('sex'))?'Ж':g('sex')?'М':'';
        const r=addPlayer(T,c,first,last,y,g('city')||c.city,RANKS.includes(g('rank'))?g('rank'):'б/р',{sex:sx,country:g('country')||'Казахстан',club:g('club')});r?skip++:ok++});
      save();render();toast(`Загружено ${ok}${skip?`, пропущено ${skip} (уже в списке)`:''}`)}catch(err){toast('Не удалось прочитать файл')}})};f.click()},
  rulesEdit(){UI.rulesEd=CUR.T.id;render()},rulesCancel(){UI.rulesEd=null;render()},
  saveRules(){const T=CUR.T;const l=document.getElementById('r-link').value.trim();if(!okUrl(normUrl(l))){document.getElementById('r-err').textContent='Проверьте ссылку';return}

  addR(el){const T=CUR.T,c=club(T.clubId);const p=c.roster.find(x=>x.id===el.dataset.id);if(!p)return;T.players.push(pub(Object.assign({country:'Казахстан',club:c.name},p)));save();render();toast(p.name+' в турнире')},
  rmP(el){const T=CUR.T;if(T.status!=='reg')return;T.players=T.players.filter(p=>p.id!==el.dataset.id);if(document.getElementById('modal').classList.contains('open'))closeModal();save();render()},
  saveClub(){const c=club(S.session);const v=id=>document.getElementById(id).value.trim();const n=Math.floor(+v('cl-tables'));
    if(!v('cl-name')||!(n>=1&&n<=60)){document.getElementById('cl-err').textContent='Проверьте название и число столов (1–60)';return}
    c.name=v('cl-name');c.city=v('cl-city');c.tables=n;c.address=v('cl-addr').slice(0,200);c.phone=v('cl-phone').slice(0,40);c.instagram=v('cl-insta').replace(/^@/,'').replace(/^https?:\/\/(www\.)?instagram\.com\//,'').replace(/\/.*$/,'').slice(0,60);UI.clubEdit=false;save();render();toast('Сохранено')},
  start(){const T=CUR.T;const e=document.getElementById('start-err');
    if(T.format==='gp'&&T.groups.advance>=Math.floor(T.players.length/T.groups.count)){e.textContent='Из группы выходит слишком много игроков для такого состава';return}
    if(T.players.length<minPlayers(T)){e.textContent='Мало участников';return}
    if(T.seedMode==='random'){for(let i=T.players.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[T.players[i],T.players[j]]=[T.players[j],T.players[i]]}}
    T.status='live';T.results={};UI.tab[T.id]='grid';save();render();toast('Сетка построена')}
};
document.addEventListener('click',e=>{if(UI.tmenu&&!(e.target.closest&&e.target.closest('.tmenu'))){UI.tmenu=null;render()}
  if(e.target.id==='modal'){closeModal();return}
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  if(a==='fmt'||a==='seedMode'||a==='callSel'||a==='pmTable'||a==='pmRace'||a==='pmScore'||a==='pmStart'||a==='autoPr')return;
  if(A[a]){e.preventDefault();A[a](el)}
});
document.addEventListener('change',e=>{
  const a=e.target.dataset&&e.target.dataset.act;
  if(a==='fmt')A.fmt();
  if(a==='seedMode'){CUR.T.seedMode=e.target.value;save()}
  if(a==='pmTable'||a==='pmRace'||a==='pmScore'||a==='pmStart')A[a](e.target);
  if(a==='callSel'&&e.target.value){A.callT({dataset:{mid:e.target.dataset.mid,t:e.target.value}})}
});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.ct==='disc')A.ctDisc(e.target);if(e.target.dataset&&e.target.dataset.act==='autoPr')A.autoPr(e.target);if(e.target.dataset&&e.target.dataset.dr&&UI.dr)A.drawIn(e.target);if(e.target.dataset&&e.target.dataset.tpr&&UI.tpSel)UI.tpSel.reason=e.target.value;if(e.target.dataset&&e.target.dataset.sch&&UI.sch)A.schIn(e.target)});
document.addEventListener('input',e=>{if(e.target.id==='pq'){UI.pq=e.target.value;renderFind()}if(e.target.id==='q'){UI.filter.q=e.target.value;renderGrid()}if(e.target.id==='rs-q')renderRoster();if(e.target.id==='wq'&&UI.wiz){UI.wiz.q=e.target.value;renderWizRoster()}if(e.target.dataset&&e.target.dataset.w&&UI.wiz){UI.wiz[e.target.dataset.w]=e.target.value;const t=document.getElementById('ws-title');if(t&&e.target.dataset.w==='title')t.textContent=e.target.value||'Без названия'}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Enter'&&e.target.id==='lg-pass'){const b=document.querySelector('[data-act=login]');b&&b.click()}if(e.key==='Enter'&&document.getElementById('sa')&&document.getElementById('modal').classList.contains('open')){const b=document.querySelector('[data-act=saveRes]');b&&b.click()}});
window.addEventListener('hashchange',()=>{closeModal();UI.confirm=null;render();window.scrollTo(0,0)});
Object.assign(A,CT_ACTS);
boot();
